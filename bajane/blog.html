<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sachethan Salian - Template Editor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles to apply the Inter font */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Ensure the main content area can scroll independently */
        main {
            overflow-y: auto;
            /* Take up all available height */
            height: 100%;
        }
        /* Simple fade-out transition for the loader */
        .loader-fade-out {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
        /* Custom height for iframe container to fill available space below the sub-header */
        #iframe-container.dynamic-height {
            height: calc(100% - var(--subheader-height, 41px));
        }
        /* Ensure body and html take full height for embedding */
        html, body {
            height: 100%;
            overflow: hidden; /* Prevent double scrollbars */
        }
        /* Custom scrollbar for main content */
        main::-webkit-scrollbar {
            width: 8px;
        }
        main::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        main::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        main::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-screen">

    <!-- Sub Header / Breadcrumb for iframe view -->
    <div id="sub-header" class="bg-slate-100 border-b border-slate-200 hidden z-20 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2">
            <nav class="text-sm font-medium">
                <span id="home-breadcrumb-link" class="text-indigo-600 hover:text-indigo-800 cursor-pointer transition-colors">Home</span>
                <span class="text-slate-400 mx-2">/</span>
                <span id="template-breadcrumb" class="text-slate-600">Editor</span>
            </nav>
        </div>
    </div>

    <!-- Main Content (Scrollable) -->
    <main class="flex-grow">
        <!-- Template Selection View -->
        <div id="template-selector" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 pt-10 h-full overflow-y-auto">
            <div class="text-center mb-2">
                <p class="mt-3 text-sm text-slate-600">Choose a template to start your creative journey</p>
            </div>

            <!-- Search and Tabs Section -->
            <div class="mb-8 flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0 sm:space-x-4">
                <!-- Search Input -->
<button onclick="window.history.back()" 
    class="absolute z-10 top-1 left-1 m-0 opacity-75 items-center justify-center px-4 py-2 border border-transparent text-base font-medium rounded-lg shadow-sm text-white bg-gray-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transform transition-transform duration-150 active:scale-95">
    &larr; Back
</button>


                <div class="relative w-full sm:w-1/2 md:w-1/3">
                    <input type="text" id="search-input" placeholder="Search templates..."
                        class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <button id="clear-search-btn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-700 hidden">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <!-- Tabs -->
                <div class="flex space-x-2 bg-slate-200 rounded-lg p-1 shadow-inner">
                    <button data-category="all" class="tab-button px-4 py-2 rounded-md text-sm font-medium text-slate-700 bg-white shadow-sm transition-all hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-1">
                        All
                    </button>
                    <button data-category="devotional" class="tab-button px-4 py-2 rounded-md text-sm font-medium text-slate-700 transition-all hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-1">
                        Devotional
                    </button>
                    <button data-category="favorite" class="tab-button px-4 py-2 rounded-md text-sm font-medium text-slate-700 transition-all hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-1">
                        Favorite
                    </button>
                </div>
            </div>

            <!-- Grid for templates will be dynamically inserted here -->
            <div id="template-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                <!-- Template cards will be generated by JavaScript -->
            </div>
        </div>

        <!-- Full Iframe View -->
        <div id="iframe-container" class="hidden h-full bg-slate-200 relative">
            <!-- Loading Overlay -->
            <div id="loading-overlay" class="absolute inset-0 bg-slate-200 bg-opacity-80 flex items-center justify-center z-10">
                <div class="flex flex-col items-center">
                    <svg class="animate-spin h-8 w-8 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="mt-4 text-lg font-medium text-slate-700">Loading Editor...</p>
                </div>
            </div>
            <iframe id="viewer" src="about:blank" title="Editor" class="w-full h-full border-0"></iframe>
        </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 hidden">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-yellow-100">
                    <svg class="h-6 w-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <h3 class="text-lg leading-6 font-medium text-gray-900 mt-4">Are you sure?</h3>
                <div class="mt-2 px-7 py-3">
                    <p class="text-sm text-gray-500">
                        Any unsaved changes will be lost. Do you want to return to the template selection?
                    </p>
                </div>
                <div class="items-center px-4 py-3 space-x-4">
                    <button id="cancel-btn" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">
                        Cancel
                    </button>
                    <button id="confirm-back-btn" class="px-4 py-2 bg-indigo-600 text-white rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Confirm
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DATA ---
            // To add a new template, just add a new object to this array.
            const templates = [
                {
                    id: 'poster-anna-poorna',
                    title: 'ಅನ್ನಪೂರ್ಣ ಆಶೀರ್ವಾದ ಸೇವಾ ಸಮಿತಿ - Poster',
                    description: 'A poster editor for the Annapoorna Seva Samithi event.',
                    previewImage: 'preview.jpg',
                    url: './index.html',
                    category: 'devotional',
                    isFavorite: false
                },
                {
                    id: 'flyer-community',
                    title: 'Community Outreach Flyer',
                    description: 'Design a flyer for local community outreach programs.',
                    previewImage: 'https://placehold.co/600x400/e0f7fa/00796b?text=Community+Flyer',
                    url: 'about:blank',
                    category: 'general',
                    isFavorite: false
                },
                {
                    id: 'form-volunteer',
                    title: 'Volunteer Sign-up Sheet',
                    description: 'Create a form for new volunteers to sign up.',
                    previewImage: 'https://placehold.co/600x400/fff3e0/e65100?text=Volunteer+Form',
                    url: 'about:blank',
                    category: 'general',
                    isFavorite: false
                },
                {
                    id: 'card-event-invite',
                    title: 'Event Invitation Card',
                    description: 'Design an elegant invitation card for special events.',
                    previewImage: 'https://placehold.co/600x400/f3e5f5/8e24aa?text=Invitation+Card',
                    url: 'about:blank',
                    category: 'general',
                    isFavorite: false
                },
                {
                    id: 'report-annual-summary',
                    title: 'Annual Report Summary',
                    description: 'Summarize key achievements in an annual report format.',
                    previewImage: 'https://placehold.co/600x400/e8f5e9/2e7d32?text=Annual+Report',
                    url: 'about:blank',
                    category: 'general',
                    isFavorite: false
                },
            ];

            // --- DOM Element Selection ---
            const mainContent = document.querySelector('main');
            const templateSelector = document.getElementById('template-selector');
            const subHeader = document.getElementById('sub-header');
            const iframeContainer = document.getElementById('iframe-container');
            const viewerIframe = document.getElementById('viewer');
            const loadingOverlay = document.getElementById('loading-overlay');
            const homeBreadcrumbLink = document.getElementById('home-breadcrumb-link');
            const templateBreadcrumb = document.getElementById('template-breadcrumb');
            const confirmationModal = document.getElementById('confirmation-modal');
            const confirmBackBtn = document.getElementById('confirm-back-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            const templateGrid = document.getElementById('template-grid');
            const searchInput = document.getElementById('search-input');
            const clearSearchBtn = document.getElementById('clear-search-btn');
            const tabButtons = document.querySelectorAll('.tab-button');

            // --- State Variables ---
            const blankPageUrl = 'about:blank';
            let currentSearchQuery = '';
            let currentCategory = 'all'; // Default category

            // --- Functions ---

            /**
             * Loads favorite template IDs from localStorage and updates the templates array.
             */
            function loadFavorites() {
                const favoriteTemplateIds = JSON.parse(localStorage.getItem('favoriteTemplates') || '[]');
                templates.forEach(template => {
                    template.isFavorite = favoriteTemplateIds.includes(template.id);
                });
            }

            /**
             * Saves the current favorite template IDs to localStorage.
             */
            function saveFavorites() {
                const favoriteIds = templates.filter(t => t.isFavorite).map(t => t.id);
                localStorage.setItem('favoriteTemplates', JSON.stringify(favoriteIds));
            }

            /**
             * Renders the template cards into the grid based on the provided array.
             * @param {Array} templatesToRender - The array of templates to display.
             */
            function renderTemplates(templatesToRender) {
                templateGrid.innerHTML = ''; // Clear existing templates
                if (templatesToRender.length === 0) {
                    templateGrid.innerHTML = `
                        <div class="col-span-full text-center py-10">
                            <p class="text-slate-500 text-lg">No templates found matching your criteria.</p>
                            <p class="text-slate-400 text-sm mt-2">Try adjusting your search or selecting a different category.</p>
                        </div>
                    `;
                    return;
                }

                templatesToRender.forEach(template => {
                    const card = document.createElement('div');
                    card.className = 'group relative flex flex-col bg-white border border-slate-200 rounded-xl shadow-md overflow-hidden transition-all duration-200 hover:shadow-lg hover:-translate-y-1';

                    const isDisabled = template.url === 'about:blank';

                    card.innerHTML = `
                        <div class="aspect-w-16 aspect-h-9 bg-slate-100">
                            <img src="${template.previewImage}" alt="${template.title} Preview" class="w-full h-48 object-cover" onerror="this.onerror=null;this.src='https://placehold.co/600x400/e2e8f0/475569?text=Image+Not+Found';">
                        </div>
                        <div class="p-5 flex-grow flex flex-col">
                            <h3 class="text-xl font-semibold text-slate-900 mb-2">${template.title}</h3>
                            <p class="text-sm text-slate-600 flex-grow mb-4">${template.description}</p>
                            <div class="flex items-center justify-between mt-auto">
                                <button
                                    class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-base font-medium rounded-lg shadow-sm text-white
                                    ${isDisabled ? 'bg-slate-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transform transition-transform duration-150 active:scale-95'}"
                                    data-url="${template.url}"
                                    data-title="${template.title}"
                                    ${isDisabled ? 'disabled' : ''}>
                                    ${isDisabled ? 'Coming Soon' : 'Open Editor'}
                                </button>
                                <button
                                    class="favorite-button ml-4 px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200
                                    ${template.isFavorite ? 'bg-yellow-500 text-white hover:bg-yellow-600' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}"
                                    data-template-id="${template.id}"
                                    title="${template.isFavorite ? 'Remove from Favorites' : 'Add to Favorites'}">
                                    <svg class="h-5 w-5 inline-block align-middle" fill="${template.isFavorite ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${template.isFavorite ? 'M11.049 2.927c.3-.532.96-.532 1.26 0l2.365 4.103a.75.75 0 00.65.362h4.73a.75.75 0 01.65 1.088l-3.83 3.166a.75.75 0 00-.24.788l1.45 4.54a.75.75 0 01-1.15 1.01l-4.06-2.5a.75.75 0 00-.81 0l-4.06 2.5a.75.75 0 01-1.15-1.01l1.45-4.54a.75.75 0 00-.24-.788L2.094 8.48a.75.75 0 01.65-1.088h4.73a.75.75 0 00.65-.362l2.365-4.103z' : 'M11.049 2.927c.3-.532.96-.532 1.26 0l2.365 4.103a.75.75 0 00.65.362h4.73a.75.75 0 01.65 1.088l-3.83 3.166a.75.75 0 00-.24.788l1.45 4.54a.75.75 0 01-1.15 1.01l-4.06-2.5a.75.75 0 00-.81 0l-4.06 2.5a.75.75 0 01-1.15-1.01l1.45-4.54a.75.75 0 00-.24-.788L2.094 8.48a.75.75 0 01.65-1.088h4.73a.75.75 0 00.65-.362l2.365-4.103z'}"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                    templateGrid.appendChild(card);
                });
            if (window.top && typeof window.top.showMessage === "function") {
    window.top.showMessage(`<strong>This is the Editing Panel. Click on 'Open Editor' to edit a poster.</strong>`, "info");
}
    
            }

            /**
             * Filters templates based on current search query and category, then renders them.
             */
            function filterAndRenderTemplates() {
                const lowerCaseQuery = currentSearchQuery.toLowerCase();
                const filtered = templates.filter(template => {
                    const matchesSearch = template.title.toLowerCase().includes(lowerCaseQuery) ||
                                          template.description.toLowerCase().includes(lowerCaseQuery);

                    let matchesCategory = false;
                    if (currentCategory === 'all') {
                        matchesCategory = true;
                    } else if (currentCategory === 'favorite') {
                        matchesCategory = template.isFavorite;
                    } else { // 'devotional' or any other specific category
                        matchesCategory = template.category === currentCategory;
                    }
                    return matchesSearch && matchesCategory;
                });
                renderTemplates(filtered);
            }

            /**
             * Updates the active tab styling.
             */
            function updateActiveTab() {
                tabButtons.forEach(button => {
                    if (button.dataset.category === currentCategory) {
                        button.classList.add('bg-white', 'shadow-sm');
                        button.classList.remove('bg-slate-200');
                    } else {
                        button.classList.remove('bg-white', 'shadow-sm');
                        button.classList.add('bg-slate-200');
                    }
                });
            }

            /**
             * Hides the loading overlay with a fade-out effect.
             */
            function hideLoader() {
                loadingOverlay.classList.add('loader-fade-out');
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                }, 500); // Match transition duration in CSS
            }

            /**
             * Switches the view to the editor iframe.
             * @param {string} url - The URL of the template to load.
             * @param {string} title - The title of the template for the breadcrumb.
             */
            function showEditor(url, title) {
                loadingOverlay.classList.remove('hidden', 'loader-fade-out');
                loadingOverlay.style.opacity = '1';

                templateSelector.classList.add('hidden');
                subHeader.classList.remove('hidden');

                // The iframe container needs to be visible to calculate the subheader height correctly
                mainContent.appendChild(iframeContainer);
                iframeContainer.classList.remove('hidden');

                // Set CSS variables for dynamic height calculation
                document.documentElement.style.setProperty('--subheader-height', `${subHeader.offsetHeight}px`);

                // The main content area will now hold the iframe
                mainContent.innerHTML = ''; // Clear the template selector
                mainContent.appendChild(iframeContainer);
                iframeContainer.classList.add('dynamic-height');

                templateBreadcrumb.textContent = title;
                viewerIframe.src = url;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            /**
             * Switches the view back to the template selector.
             */
            function showTemplateSelector() {
                viewerIframe.src = blankPageUrl;

                // Clear main content and re-insert the template selector
                mainContent.innerHTML = '';
                mainContent.appendChild(templateSelector);

                templateSelector.classList.remove('hidden');
                iframeContainer.classList.add('hidden');
                subHeader.classList.add('hidden');

                closeConfirmationModal();
            }

            /**
             * Shows the confirmation modal if the editor is active.
             */
            function openConfirmationModal() {
                if (!iframeContainer.classList.contains('hidden')) {
                    confirmationModal.classList.remove('hidden');
                } else {
                    showTemplateSelector();
                }
            }

            /**
             * Hides the confirmation modal.
             */
            function closeConfirmationModal() {
                confirmationModal.classList.add('hidden');
            }

            // --- Event Listeners ---
            viewerIframe.addEventListener('load', hideLoader);

            templateGrid.addEventListener('click', (e) => {
                const favoriteButton = e.target.closest('.favorite-button');
                if (favoriteButton) {
                    const templateId = favoriteButton.dataset.templateId;
                    const template = templates.find(t => t.id === templateId);
                    if (template) {
                        template.isFavorite = !template.isFavorite;
                        saveFavorites();
                        filterAndRenderTemplates(); // Re-render to update the button state and filter
                    }
                    return; // Prevent triggering the 'Open Editor' logic
                }

                const openEditorButton = e.target.closest('button:not(.favorite-button)'); // Exclude favorite button
                if (openEditorButton && openEditorButton.dataset.url) {
                    const { url, title } = openEditorButton.dataset;
                    if (url && url !== blankPageUrl) {
                        showEditor(url, title);
                    }
                }
            });

            homeBreadcrumbLink.addEventListener('click', openConfirmationModal);
            confirmBackBtn.addEventListener('click', showTemplateSelector);
            cancelBtn.addEventListener('click', closeConfirmationModal);

            window.addEventListener('click', (event) => {
                if (event.target === confirmationModal) {
                    closeConfirmationModal();
                }
            });

            // Search functionality
            searchInput.addEventListener('input', (e) => {
                currentSearchQuery = e.target.value;
                if (currentSearchQuery.length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
                filterAndRenderTemplates();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                currentSearchQuery = '';
                clearSearchBtn.classList.add('hidden');
                filterAndRenderTemplates();
            });

            // Tab functionality
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    currentCategory = button.dataset.category;
                    updateActiveTab();
                    filterAndRenderTemplates();
                });
            });

            // --- Initial Load ---
            loadFavorites(); // Load favorite status from local storage
            updateActiveTab(); // Set initial active tab styling
            filterAndRenderTemplates(); // Render templates based on initial state
        });
    </script>

</body>
</html>
