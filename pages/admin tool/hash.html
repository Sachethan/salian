<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet Mapping Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for a professional look and feel */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* A light gray background */
        }
        /* Style for the expand/collapse transition */
        .details-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .details-panel.expanded {
            max-height: 500px; /* Adjust as needed */
        }
        /* Custom modal backdrop */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <div class="container mx-auto p-4 md:p-6 max-w-4xl">
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Mapping Manager</h1>
            <p class="text-gray-600 mt-1">Manage your sheet mappings with ease.</p>
        </header>

        <!-- Add New Mapping Section (Collapsible) -->
        <div class="bg-white rounded-lg shadow-md mb-6">
            <button id="toggle-add-form" class="w-full p-4 text-left font-semibold text-lg flex justify-between items-center">
                <span>Add New Mapping</span>
                <svg id="add-form-icon" class="w-5 h-5 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <div id="add-form-panel" class="px-4 pb-4 hidden">
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input id="addHash" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Hash (Required)">
                    <input id="addTemplate" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Template ID">
                    <input id="addRoot" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="RootFileName">
                    <input id="addUrl" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="SubURLName">
                </div>
                <button id="addBtn" class="mt-4 w-full md:w-auto bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Add Mapping
                </button>
            </div>
        </div>

        <!-- Search and Status -->
        <div class="mb-4">
            <input id="searchBox" class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" type="text" placeholder="Search by Hash, Template, Root, or URL...">
        </div>
        <div id="status" class="min-h-[1.5em] mb-4 text-sm font-medium"></div>

        <!-- Mappings List -->
        <div id="mappingsList" class="space-y-3">
            <!-- Mapping items will be dynamically inserted here -->
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm">
            <h3 class="text-lg font-bold text-gray-900">Confirm Deletion</h3>
            <p id="delete-modal-text" class="text-gray-600 mt-2 mb-4">Are you sure you want to delete this mapping?</p>
            <div class="flex justify-end space-x-3">
                <button id="cancel-delete-btn" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">Cancel</button>
                <button id="confirm-delete-btn" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">Delete</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbziNy-rYG9oWJSHkSvyytw09IYLIHoConrNLji_SCT8Jc99aUmmc9FC0e2Oyp7lI7CQ/exec";
        let mappings = []; // Full dataset from the server
        let rowToDelete = null; // Store the row number for the delete confirmation

        // --- DOM Elements ---
        const searchBox = document.getElementById('searchBox');
        const addBtn = document.getElementById('addBtn');
        const mappingsList = document.getElementById('mappingsList');
        const statusEl = document.getElementById('status');
        const toggleAddFormBtn = document.getElementById('toggle-add-form');
        const addFormPanel = document.getElementById('add-form-panel');
        const addFormIcon = document.getElementById('add-form-icon');
        const deleteModal = document.getElementById('delete-modal');
        const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
        const confirmDeleteBtn = document.getElementById('confirm-delete-btn');

        // --- Utility Functions ---
        function setStatus(msg, isErr = false) {
            statusEl.textContent = msg;
            statusEl.className = `min-h-[1.5em] mb-4 text-sm font-medium ${isErr ? 'text-red-600' : 'text-green-600'}`;
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[c]));
        }

        // --- Core Application Logic ---
        async function fetchMappings() {
            setStatus('Loading mappings...');
            mappingsList.innerHTML = '<div class="text-center p-8 text-gray-500">Loading...</div>';
            try {
                const res = await fetch(SCRIPT_URL, { method: 'GET', cache: 'no-store' });
                if (!res.ok) throw new Error(`Network response was not ok (${res.status})`);
                const json = await res.json();
                if (!json.success) throw new Error(json.error || 'Failed to load data from script.');
                
                mappings = json.data || [];
                renderMappings();
                setStatus(`Loaded ${mappings.length} rows.`);
            } catch (err) {
                console.error(err);
                setStatus('Error loading data: ' + err.message, true);
                mappingsList.innerHTML = `<div class="text-center p-8 text-red-500 bg-red-100 rounded-lg">${escapeHtml(err.message)}</div>`;
            }
        }

        function renderMappings(filterText = '') {
            const t = filterText.trim().toLowerCase();
            const filteredMappings = t ? mappings.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(t))) : mappings;
            
            mappingsList.innerHTML = ''; // Clear previous list

            if (filteredMappings.length === 0) {
                mappingsList.innerHTML = '<div class="text-center p-8 text-gray-500">No mappings found.</div>';
                return;
            }

            filteredMappings.forEach(row => {
                const item = document.createElement('div');
                item.className = 'bg-white rounded-lg shadow-md overflow-hidden';
                item.dataset.rowNumber = row.rowNumber;
                item.innerHTML = createMappingItemHTML(row);
                mappingsList.appendChild(item);
            });
        }

        function createMappingItemHTML(row, isEditing = false) {
            const rowData = {
                hash: row.hash || '',
                templateId: row.templateId || '',
                root: row.root || '',
                url: row.url || ''
            };

            if (isEditing) {
                return `
                    <div class="p-4 border-l-4 border-blue-500">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Hash</label>
                                <input class="mt-1 w-full p-2 border border-gray-300 rounded-md" name="hash" value="${escapeHtml(rowData.hash)}">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Template ID</label>
                                <input class="mt-1 w-full p-2 border border-gray-300 rounded-md" name="templateId" value="${escapeHtml(rowData.templateId)}">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">RootFileName</label>
                                <input class="mt-1 w-full p-2 border border-gray-300 rounded-md" name="root" value="${escapeHtml(rowData.root)}">
                            </div>
                             <div>
                                <label class="block text-sm font-medium text-gray-700">SubURLName</label>
                                <input class="mt-1 w-full p-2 border border-gray-300 rounded-md" name="url" value="${escapeHtml(rowData.url)}">
                            </div>
                        </div>
                        <div class="flex justify-end space-x-2">
                            <button data-action="cancel" class="px-3 py-1 bg-gray-200 text-gray-800 text-sm font-semibold rounded-md hover:bg-gray-300">Cancel</button>
                            <button data-action="save" class="px-3 py-1 bg-green-600 text-white text-sm font-semibold rounded-md hover:bg-green-700">Save</button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="p-4 flex justify-between items-center cursor-pointer" data-action="expand">
                    <div class="font-semibold text-gray-800 truncate pr-4">${escapeHtml(rowData.hash)}</div>
                    <svg class="w-5 h-5 text-gray-500 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <div class="details-panel bg-gray-50 border-t border-gray-200">
                    <div class="p-4 space-y-3">
                        <div><strong class="text-gray-600 w-28 inline-block">Template ID:</strong> ${escapeHtml(rowData.templateId)}</div>
                        <div><strong class="text-gray-600 w-28 inline-block">Root File:</strong> ${escapeHtml(rowData.root)}</div>
                        <div><strong class="text-gray-600 w-28 inline-block">Sub URL:</strong> ${escapeHtml(rowData.url)}</div>
                        <div class="flex justify-end space-x-2 pt-2">
                            <button data-action="edit" class="px-3 py-1 bg-blue-100 text-blue-800 text-sm font-semibold rounded-md hover:bg-blue-200">Edit</button>
                            <button data-action="delete" class="px-3 py-1 bg-red-100 text-red-800 text-sm font-semibold rounded-md hover:bg-red-200">Delete</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        async function addRow() {
            const hash = document.getElementById('addHash').value.trim();
            const templateId = document.getElementById('addTemplate').value.trim();
            const root = document.getElementById('addRoot').value.trim();
            const url = document.getElementById('addUrl').value.trim();

            if (!hash) {
                setStatus('Hash is a required field.', true);
                return;
            }
            
            setStatus('Adding new mapping...');
            addBtn.disabled = true;
            addBtn.textContent = 'Adding...';

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'add', hash, templateId, root, url })
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.error || 'Add operation failed.');
                
                ['addHash', 'addTemplate', 'addRoot', 'addUrl'].forEach(id => document.getElementById(id).value = '');
                await fetchMappings();
                setStatus('Successfully added new mapping.');
            } catch (err) {
                console.error(err);
                setStatus('Add error: ' + err.message, true);
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = 'Add Mapping';
            }
        }
        
        async function saveEditRow(item, rowNumber) {
            const hash = item.querySelector('input[name="hash"]').value.trim();
            const templateId = item.querySelector('input[name="templateId"]').value.trim();
            const root = item.querySelector('input[name="root"]').value.trim();
            const url = item.querySelector('input[name="url"]').value.trim();

            if (!hash) {
                setStatus('Hash is required.', true);
                return;
            }

            setStatus('Saving changes...');
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'update', rowNumber, hash, templateId, root, url })
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.error || 'Update failed');
                
                await fetchMappings(); // Refresh the entire list to ensure consistency
                setStatus('Row updated successfully.');
            } catch (err) {
                console.error(err);
                setStatus('Update error: ' + err.message, true);
                // Optionally, restore the original view of the row on failure
                renderMappings(searchBox.value);
            }
        }

        async function performDelete(rowNumber) {
            setStatus('Deleting row...');
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', rowNumber })
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.error || 'Delete failed');
                
                await fetchMappings();
                setStatus('Row deleted.');
            } catch (err) {
                console.error(err);
                setStatus('Delete error: ' + err.message, true);
            }
        }

        // --- Event Listeners ---
        searchBox.addEventListener('input', () => renderMappings(searchBox.value));
        addBtn.addEventListener('click', addRow);
        
        toggleAddFormBtn.addEventListener('click', () => {
            addFormPanel.classList.toggle('hidden');
            addFormIcon.classList.toggle('rotate-180');
        });

        mappingsList.addEventListener('click', (e) => {
            const button = e.target.closest('button');
            const expander = e.target.closest('[data-action="expand"]');
            const item = e.target.closest('[data-row-number]');
            if (!item) return;

            const rowNumber = Number(item.dataset.rowNumber);
            const rowData = mappings.find(r => r.rowNumber === rowNumber);

            if (button) {
                const action = button.dataset.action;
                if (action === 'edit') {
                    item.innerHTML = createMappingItemHTML(rowData, true);
                } else if (action === 'delete') {
                    rowToDelete = rowNumber;
                    document.getElementById('delete-modal-text').textContent = `Are you sure you want to delete mapping with hash: "${rowData.hash}"?`;
                    deleteModal.classList.remove('hidden');
                } else if (action === 'save') {
                    saveEditRow(item, rowNumber);
                } else if (action === 'cancel') {
                    item.innerHTML = createMappingItemHTML(rowData, false);
                }
            } else if (expander) {
                const details = item.querySelector('.details-panel');
                const icon = item.querySelector('svg');
                details.classList.toggle('expanded');
                icon.classList.toggle('rotate-180');
            }
        });

        // Modal event listeners
        cancelDeleteBtn.addEventListener('click', () => {
            deleteModal.classList.add('hidden');
            rowToDelete = null;
        });

        confirmDeleteBtn.addEventListener('click', () => {
            if (rowToDelete !== null) {
                performDelete(rowToDelete);
            }
            deleteModal.classList.add('hidden');
            rowToDelete = null;
        });

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', fetchMappings);

    </script>
</body>
</html>
