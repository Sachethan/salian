<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; } /* slate-50 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .glass-modal { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-4">
    <!-- Header / Search Bar -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 sticky top-0 z-10">
      <div class="relative w-full sm:w-80">
        <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
        <input id="userSearch" type="text" placeholder="Search users..." class="w-full pl-9 pr-4 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-shadow">
      </div>
      <div class="flex items-center gap-3">
        <span id="userListCount" class="text-xs text-slate-500 font-mono">0 records</span>
        <button id="exportUsers" class="px-3 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center gap-2 transition-colors">
          <i data-lucide="download" class="w-3 h-3"></i> Export
        </button>
      </div>
    </div>
    
    <!-- Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left whitespace-nowrap">
          <thead class="bg-slate-50 text-slate-500 font-medium border-b border-slate-200">
            <tr>
              <th class="px-4 md:px-6 py-3">User</th>
              <th class="px-4 md:px-6 py-3 hidden sm:table-cell">Role</th>
              <th class="px-4 md:px-6 py-3 hidden md:table-cell">UID</th>
              <th class="px-4 md:px-6 py-3">Status</th>
              <th class="px-4 md:px-6 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="usersList" class="divide-y divide-slate-100">
            <tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div id="editModal" class="relative z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity opacity-0" id="modalBackdrop"></div>
  
    <!-- Modal Container -->
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-center justify-center p-4 text-center">
        
        <!-- Modal Panel -->
        <div id="modalPanel" class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-2xl transition-all opacity-0 scale-95 w-full max-w-lg border border-slate-100">
          
          <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
            <div class="sm:flex sm:items-start">
              <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-indigo-50 sm:mx-0 sm:h-10 sm:w-10">
                <i data-lucide="user-cog" class="h-6 w-6 text-indigo-600"></i>
              </div>
              <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left w-full">
                <h3 class="text-base font-semibold leading-6 text-slate-900" id="modal-title">Edit User Details</h3>
                <div class="mt-4 space-y-4">
                  
                  <!-- Username Field -->
                  <div>
                    <label for="editUsername" class="block text-xs font-medium text-slate-500 mb-1">Username / Display Name</label>
                    <input type="text" id="editUsername" class="block w-full rounded-md border-0 py-1.5 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 px-3">
                  </div>

                  <!-- Role Field -->
                  <div>
                    <label for="editRole" class="block text-xs font-medium text-slate-500 mb-1">Role</label>
                    <select id="editRole" class="block w-full rounded-md border-0 py-1.5 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 px-3">
                      <option value="user">User</option>
                      <option value="admin">Admin</option>
                      <option value="moderator">Moderator</option>
                      <option value="editor">Editor</option>
                    </select>
                  </div>

                  <!-- Password Reset Section -->
                  <div class="relative flex items-center gap-x-3 rounded-md border border-dashed border-slate-300 p-3 bg-slate-50/50">
                    <div class="text-sm leading-6">
                      <label class="font-medium text-slate-900">Password Reset</label>
                      <p class="text-xs text-slate-500">Send a password reset link to <span id="resetEmailDisplay" class="font-mono text-indigo-600">user@example.com</span></p>
                    </div>
                    <button type="button" id="btnSendReset" class="ml-auto rounded-md bg-white px-2.5 py-1.5 text-xs font-semibold text-indigo-600 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50">Send Email</button>
                  </div>
                  <p id="resetFeedback" class="text-xs text-emerald-600 font-medium hidden text-center">Reset email sent successfully!</p>

                </div>
              </div>
            </div>
          </div>
          
          <div class="bg-slate-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6 border-t border-slate-100">
            <button type="button" id="btnSaveUser" class="inline-flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 sm:ml-3 sm:w-auto transition-colors">Save Changes</button>
            <button type="button" onclick="closeModal()" class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 sm:mt-0 sm:w-auto transition-colors">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCC7sNEByDpD-ftE936NoyF1W6KnHzCZME",
        authDomain: "salian-hub.firebaseapp.com",
        projectId: "salian-hub",
        storageBucket: "salian-hub.firebasestorage.app",
        messagingSenderId: "389748625220",
        appId: "1:389748625220:web:c5b5dabdd424f06ee65111",
        measurementId: "G-Z0Z062P4YP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allUsers = [];
    let currentEditId = null;
    let currentEditEmail = null;

    // Global refresh function called by parent
    window.refreshData = () => fetchUsers();

    onAuthStateChanged(auth, (user) => {
      if(user) fetchUsers();
      else {
        // Handle unauthenticated state if necessary
        document.getElementById('usersList').innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">Please sign in to view users</td></tr>';
      }
    });

    async function fetchUsers() {
      try {
        const snap = await getDocs(collection(db, 'users'));
        allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderUsers();
      } catch (e) {
        console.error("Error fetching users:", e);
        document.getElementById('usersList').innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-400">Error loading data: ${e.message}</td></tr>`;
      }
    }

    function renderUsers() {
      const q = document.getElementById('userSearch').value.toLowerCase();
      const filtered = allUsers.filter(u => 
        (u.username || u.name || '').toLowerCase().includes(q) || 
        (u.email || '').toLowerCase().includes(q) ||
        u.id.toLowerCase().includes(q) ||
        (u.role || '').toLowerCase().includes(q)
      );

      document.getElementById('userListCount').textContent = `${filtered.length} records`;
      const tbody = document.getElementById('usersList');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">No users found</td></tr>';
        return;
      }

      filtered.forEach(u => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-50 transition-colors group';
        
        const displayName = u.username || u.name || 'Unknown';
        const displayInitial = (displayName || 'U')[0].toUpperCase();
        const avatar = u.photoURL 
          ? `<img src="${u.photoURL}" class="w-8 h-8 rounded-full object-cover border border-slate-200" onerror="this.onerror=null;this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiNjYmQ1ZTEiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMjAgMjF2LTJhNCA0IDAgMCAwLTQtNEg4YTQgNCAwIDAgMC00IDR2MiIvPjxjaXJjbGUgY3g9IjEyIiBjeT0iNyIgcj0iNCIvPjwvc3ZnPg=='">`
          : `<div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs ring-2 ring-white">${displayInitial}</div>`;

        const flagBtn = u.flagged 
           ? `<button data-id="${u.id}" data-action="unflag" class="flagBtn p-1.5 text-emerald-600 bg-emerald-50 rounded hover:bg-emerald-100 transition-colors" title="Unflag"><i data-lucide="flag-off" class="w-4 h-4"></i></button>`
           : `<button data-id="${u.id}" data-action="flag" class="flagBtn p-1.5 text-amber-600 bg-amber-50 rounded hover:bg-amber-100 transition-colors" title="Flag"><i data-lucide="flag" class="w-4 h-4"></i></button>`;
        
        const role = u.role || 'user';
        const roleBadge = role === 'admin' 
          ? `<span class="inline-flex items-center rounded-md bg-purple-50 px-2 py-1 text-xs font-medium text-purple-700 ring-1 ring-inset ring-purple-700/10">Admin</span>`
          : role === 'moderator' 
            ? `<span class="inline-flex items-center rounded-md bg-blue-50 px-2 py-1 text-xs font-medium text-blue-700 ring-1 ring-inset ring-blue-700/10">Mod</span>`
            : `<span class="inline-flex items-center rounded-md bg-slate-50 px-2 py-1 text-xs font-medium text-slate-600 ring-1 ring-inset ring-slate-500/10">User</span>`;

        row.innerHTML = `
          <td class="px-4 md:px-6 py-3">
             <div class="flex items-center gap-3">
               ${avatar}
               <div>
                 <div class="font-medium text-slate-900">${escapeHtml(displayName)}</div>
                 <div class="text-xs text-slate-500 font-mono">${escapeHtml(u.email || 'No email')}</div>
               </div>
             </div>
          </td>
          <td class="px-4 md:px-6 py-3 hidden sm:table-cell">
            ${roleBadge}
          </td>
          <td class="px-6 py-3 font-mono text-xs text-slate-400 hidden md:table-cell select-all cursor-pointer" title="Click to select">${u.id.substring(0,8)}...</td>
          <td class="px-4 md:px-6 py-3">
            ${u.flagged 
              ? '<span class="inline-flex items-center gap-1 px-2 py-1 bg-red-50 text-red-700 rounded text-xs font-medium border border-red-100"><div class="w-1.5 h-1.5 rounded-full bg-red-500"></div>Flagged</span>' 
              : '<span class="inline-flex items-center gap-1 px-2 py-1 bg-emerald-50 text-emerald-700 rounded text-xs font-medium border border-emerald-100"><div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>Active</span>'}
          </td>
          <td class="px-4 md:px-6 py-3 text-right">
            <div class="flex items-center justify-end space-x-2 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity">
              <button data-id="${u.id}" class="editBtn p-1.5 text-indigo-600 bg-indigo-50 rounded hover:bg-indigo-100 transition-colors" title="Edit User"><i data-lucide="file-pen-line" class="w-4 h-4"></i></button>
              ${flagBtn}
              <button data-id="${u.id}" class="deleteBtn p-1.5 text-rose-600 bg-rose-50 rounded hover:bg-rose-100 transition-colors" title="Delete User"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </td>
        `;
        tbody.appendChild(row);
      });
      lucide.createIcons();
      attachHandlers();
    }

    function attachHandlers() {
      // Edit Button
      document.querySelectorAll('.editBtn').forEach(b => b.addEventListener('click', (e) => {
         const id = e.currentTarget.dataset.id;
         const user = allUsers.find(u => u.id === id);
         if(user) openEditModal(user);
      }));

      // Delete Button
      document.querySelectorAll('.deleteBtn').forEach(b => b.addEventListener('click', async (e) => {
         const id = e.currentTarget.dataset.id;
         if(confirm('Are you sure you want to delete this user? This action cannot be undone.')) {
            try {
              await deleteDoc(doc(db, 'users', id));
              fetchUsers(); // Refresh list
            } catch(err) {
              alert("Error deleting user: " + err.message);
            }
         }
      }));

      // Flag Button
      document.querySelectorAll('.flagBtn').forEach(b => b.addEventListener('click', async (e) => {
         const { id, action } = e.currentTarget.dataset;
         // Optional confirmation for flagging, removed for speed/ux or keep if preferred
         // if(confirm(`${action === 'flag' ? 'Flag' : 'Unflag'} user?`)) { 
            await updateDoc(doc(db, 'users', id), { flagged: action === 'flag' });
            fetchUsers();
         // }
      }));
    }

    // --- Modal Logic ---
    window.openEditModal = (user) => {
      currentEditId = user.id;
      currentEditEmail = user.email;
      
      document.getElementById('editUsername').value = user.username || user.name || '';
      document.getElementById('editRole').value = user.role || 'user';
      document.getElementById('resetEmailDisplay').textContent = user.email || 'No email available';
      document.getElementById('resetFeedback').classList.add('hidden');
      
      // Disable reset button if no email
      document.getElementById('btnSendReset').disabled = !user.email;
      if(!user.email) document.getElementById('btnSendReset').classList.add('opacity-50', 'cursor-not-allowed');
      else document.getElementById('btnSendReset').classList.remove('opacity-50', 'cursor-not-allowed');

      const modal = document.getElementById('editModal');
      const backdrop = document.getElementById('modalBackdrop');
      const panel = document.getElementById('modalPanel');

      modal.classList.remove('hidden');
      
      // Animation frame for transition
      requestAnimationFrame(() => {
          backdrop.classList.remove('opacity-0');
          panel.classList.remove('opacity-0', 'scale-95');
          panel.classList.add('scale-100');
      });
    }

    window.closeModal = () => {
      const modal = document.getElementById('editModal');
      const backdrop = document.getElementById('modalBackdrop');
      const panel = document.getElementById('modalPanel');
      
      backdrop.classList.add('opacity-0');
      panel.classList.remove('scale-100');
      panel.classList.add('opacity-0', 'scale-95');
      
      setTimeout(() => {
        modal.classList.add('hidden');
        currentEditId = null;
        currentEditEmail = null;
      }, 200);
    }

    // Close on backdrop click (double check in case the event bubbles weirdly)
    document.getElementById('modalBackdrop').addEventListener('click', closeModal);

    document.getElementById('btnSaveUser').addEventListener('click', async () => {
      if(!currentEditId) return;
      
      const newName = document.getElementById('editUsername').value;
      const newRole = document.getElementById('editRole').value;
      
      try {
        await updateDoc(doc(db, 'users', currentEditId), { 
          username: newName,
          name: newName, // Update both common fields for consistency
          role: newRole 
        });
        closeModal();
        fetchUsers();
      } catch(err) {
        alert("Error updating user: " + err.message);
      }
    });

    document.getElementById('btnSendReset').addEventListener('click', async () => {
      if(!currentEditEmail) return;
      
      try {
        await sendPasswordResetEmail(auth, currentEditEmail);
        const fb = document.getElementById('resetFeedback');
        fb.classList.remove('hidden');
        fb.textContent = `Reset email sent to ${currentEditEmail}`;
      } catch(err) {
        alert("Error sending email: " + err.message);
      }
    });

    // --- Search & Export ---
    document.getElementById('userSearch').addEventListener('input', renderUsers);
    
    document.getElementById('exportUsers').addEventListener('click', () => {
       const rows = allUsers;
       if(!rows.length) return;
       const keys = Object.keys(rows[0]);
       const csv = [keys.join(','), ...rows.map(r => keys.map(k => `"${String(r[k]||'').replace(/"/g,'""')}"`).join(','))].join('\n');
       const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
       const a = document.createElement('a'); a.href = url; a.download = 'users_export.csv';
       document.body.appendChild(a); a.click(); a.remove();
    });

    function escapeHtml(s) { return s ? s.toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) : ''; }
  </script>
</body>
</html>
