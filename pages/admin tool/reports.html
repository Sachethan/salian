<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual View Interface</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                fontFamily: {
                    sans: ['Inter', 'sans-serif'],
                },
            }
        }
    </script>
    
    <style>
        /* Smooth fade transition for iframe switching */
        .iframe-container {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-1 sm:p-1">

    <div class="max-w-7xl mx-auto space-y-1">
        
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6">
            <div class="bg-white p-1 rounded-xl border border-slate-200 shadow-sm inline-flex items-center">
                <button 
                    onclick="switchTab('view1')" 
                    id="btn-view1" 
                    class="flex items-center gap-2 px-4 py-2 m-1 rounded-lg text-sm font-medium transition-all duration-200 bg-indigo-600 text-white shadow-sm ring-1 ring-black/5">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Annapoorna Report</span>
                </button>
                <button 
                    onclick="switchTab('view2')" 
                    id="btn-view2" 
                    class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-slate-500 hover:text-slate-900 hover:bg-slate-50">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Sharabeswara Report</span>
                </button>
            </div>
        </div>

        <div class="bg-white border border-slate-200 shadow-sm rounded-xl overflow-hidden h-[90vh] relative">
            
            <div id="view1" class="w-full h-full">
                <iframe 
                    src="../../online tool/posters/annapoorna/report.html" 
                    class="w-full h-full border-0" 
                    title="View 1">
                </iframe>
            </div>

            <div id="view2" class="w-full h-full hidden">
                <iframe 
                    src="../../online tool/posters/sharabeswara/report.html" 
                    class="w-full h-full border-0" 
                    title="View 2">
                </iframe>
            </div>

        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        function switchTab(targetId) {
            const btn1 = document.getElementById('btn-view1');
            const btn2 = document.getElementById('btn-view2');
            const view1 = document.getElementById('view1');
            const view2 = document.getElementById('view2');

            // Active Class Styles (Indigo Background, White Text)
            const activeClasses = ['bg-indigo-600', 'text-white', 'shadow-sm', 'ring-1', 'ring-black/5'];
            // Inactive Class Styles (Slate Text, Hover effect)
            const inactiveClasses = ['text-slate-500', 'hover:text-slate-900', 'hover:bg-slate-50'];

            if (targetId === 'view1') {
                // Show View 1, Hide View 2
                view1.classList.remove('hidden');
                view2.classList.add('hidden');

                // Style Button 1 as Active
                btn1.classList.add(...activeClasses);
                btn1.classList.remove(...inactiveClasses);

                // Style Button 2 as Inactive
                btn2.classList.remove(...activeClasses);
                btn2.classList.add(...inactiveClasses);
            } else {
                // Show View 2, Hide View 1
                view2.classList.remove('hidden');
                view1.classList.add('hidden');

                // Style Button 2 as Active
                btn2.classList.add(...activeClasses);
                btn2.classList.remove(...inactiveClasses);

                // Style Button 1 as Inactive
                btn1.classList.remove(...activeClasses);
                btn1.classList.add(...inactiveClasses);
            }
        }
    </script>
</body>
</html>
