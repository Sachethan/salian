<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center h-screen">

  <div class="bg-white rounded-xl p-8 text-center border border-slate-200 max-w-lg w-full shadow-sm">
     <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
        <i data-lucide="flag" class="w-8 h-8"></i>
     </div>
     <h3 class="text-lg font-semibold text-slate-800">Reports Management</h3>
     <p class="text-slate-500 mt-2 mb-6">Reports are currently aggregated in the main overview. Detailed resolution views will appear here.</p>
     
     <div class="bg-slate-50 p-4 rounded-lg text-left text-sm border border-slate-200">
        <p class="font-medium text-slate-700 mb-2">Current Status:</p>
        <div id="statusContent" class="text-slate-500">Loading statistics...</div>
     </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCC7sNEByDpD-ftE936NoyF1W6KnHzCZME",
        authDomain: "salian-hub.firebaseapp.com",
        projectId: "salian-hub",
        storageBucket: "salian-hub.firebasestorage.app",
        messagingSenderId: "389748625220",
        appId: "1:389748625220:web:c5b5dabdd424f06ee65111",
        measurementId: "G-Z0Z062P4YP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.refreshData = () => loadStats();

    onAuthStateChanged(auth, (user) => {
      if(user) loadStats();
    });

    async function loadStats() {
      try {
        const snap = await getDocs(collection(db, 'reports'));
        const count = snap.size;
        const resolved = snap.docs.filter(d => d.data().status === 'resolved').length;
        
        document.getElementById('statusContent').innerHTML = `
          <ul class="space-y-1">
            <li class="flex justify-between"><span>Total Reports:</span> <span class="font-bold">${count}</span></li>
            <li class="flex justify-between"><span>Resolved:</span> <span class="text-emerald-600 font-bold">${resolved}</span></li>
            <li class="flex justify-between"><span>Pending:</span> <span class="text-red-500 font-bold">${count - resolved}</span></li>
          </ul>
        `;
      } catch(e) {
        document.getElementById('statusContent').textContent = "Error loading reports.";
      }
    }
    lucide.createIcons();
  </script>
</body>
</html>
