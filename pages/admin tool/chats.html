<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-4">
    <!-- Toolbar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sticky top-0 bg-slate-50/95 backdrop-blur py-2 z-10">
      <p class="text-sm text-slate-500 font-medium">Monitoring active rooms</p>
      <div class="flex gap-2 w-full sm:w-auto">
        <button id="selectAllChats" class="flex-1 sm:flex-none px-3 py-2 text-xs font-medium bg-white border border-slate-300 rounded hover:bg-slate-50 transition-colors">Select All</button>
        <button id="deleteSelectedChats" class="flex-1 sm:flex-none px-3 py-2 text-xs font-medium bg-red-600 text-white border border-red-600 rounded hover:bg-red-700 transition-colors flex items-center justify-center gap-1 shadow-sm">
          <i data-lucide="trash-2" class="w-3 h-3"></i> Delete Selected
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
       <div class="overflow-x-auto">
          <table class="w-full text-sm text-left whitespace-nowrap">
            <thead class="bg-slate-50 text-slate-500 font-medium border-b border-slate-200">
              <tr>
                <th class="w-10 px-4 py-3 text-center"><i data-lucide="check-square" class="w-4 h-4 mx-auto"></i></th>
                <th class="px-4 py-3 hidden sm:table-cell">Room ID</th>
                <th class="px-4 py-3">Sender</th>
                <th class="px-4 py-3">Message</th>
                <th class="px-4 py-3 w-40 hidden md:table-cell">Time</th>
                <th class="px-4 py-3 w-20"></th>
              </tr>
            </thead>
            <tbody id="chatsList" class="divide-y divide-slate-100">
              <tr><td colspan="6" class="p-4 text-center text-slate-400">Loading messages...</td></tr>
            </tbody>
          </table>
       </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCC7sNEByDpD-ftE936NoyF1W6KnHzCZME",
        authDomain: "salian-hub.firebaseapp.com",
        projectId: "salian-hub",
        storageBucket: "salian-hub.firebasestorage.app",
        messagingSenderId: "389748625220",
        appId: "1:389748625220:web:c5b5dabdd424f06ee65111",
        measurementId: "G-Z0Z062P4YP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.refreshData = () => loadRecentChats();

    onAuthStateChanged(auth, (user) => {
      if(user) loadRecentChats();
    });

    async function loadRecentChats() {
      const tbody = document.getElementById('chatsList');
      // tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">Refreshing...</td></tr>';
      
      try {
        const roomsSnap = await getDocs(collection(db, 'chats'));
        if (roomsSnap.empty) {
          tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">No active chat rooms</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        let msgCount = 0;

        for (const roomDoc of roomsSnap.docs) {
          const roomId = roomDoc.id;
          const msgRef = collection(db, 'chats', roomId, 'messages');
          const msgSnap = await getDocs(msgRef);

          msgSnap.docs.forEach(msg => {
             msgCount++;
             const c = msg.data();
             const date = c.createdAt ? new Date(c.createdAt.seconds * 1000).toLocaleString() : 'N/A';
             
             const tr = document.createElement('tr');
             tr.className = 'hover:bg-slate-50 transition-colors border-b border-slate-50';
             tr.innerHTML = `
               <td class="px-4 py-3 text-center">
                  <input type="checkbox" class="chatSelect rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" data-room="${roomId}" data-id="${msg.id}" />
               </td>
               <td class="px-4 py-3 text-xs font-mono text-indigo-600 hidden sm:table-cell">${roomId.substring(0,8)}...</td>
               <td class="px-4 py-3 font-medium text-slate-800 text-xs">${escapeHtml(c.sender || 'Unknown')}</td>
               <td class="px-4 py-3 text-slate-600 max-w-xs truncate block md:table-cell">${escapeHtml(c.text || '')}</td>
               <td class="px-4 py-3 text-xs text-slate-400 whitespace-nowrap hidden md:table-cell">${date}</td>
               <td class="px-4 py-3 text-right">
                  <button data-room="${roomId}" data-id="${msg.id}" class="deleteSingleChat text-red-400 hover:text-red-600 p-1 rounded hover:bg-red-50">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
               </td>
             `;
             tbody.appendChild(tr);
          });
        }
        
        if(msgCount === 0) {
           tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">No messages found in rooms</td></tr>';
        }
        lucide.createIcons();
        attachHandlers();

      } catch(e) { console.error(e); }
    }

    function attachHandlers() {
      document.querySelectorAll('.deleteSingleChat').forEach(btn => {
         btn.addEventListener('click', async (e) => {
            if(confirm('Delete message?')) {
               const { room, id } = e.currentTarget.dataset;
               await deleteDoc(doc(db, 'chats', room, 'messages', id));
               e.currentTarget.closest('tr').remove();
            }
         });
      });
    }

    document.getElementById('selectAllChats').addEventListener('click', () => {
       const boxes = document.querySelectorAll('.chatSelect');
       const all = Array.from(boxes).every(c => c.checked);
       boxes.forEach(c => c.checked = !all);
    });

    document.getElementById('deleteSelectedChats').addEventListener('click', async () => {
       const selected = document.querySelectorAll('.chatSelect:checked');
       if(!selected.length) return alert('No messages selected');
       if(!confirm(`Delete ${selected.length} messages?`)) return;
       
       await Promise.all(Array.from(selected).map(c => 
          deleteDoc(doc(db, 'chats', c.dataset.room, 'messages', c.dataset.id))
       ));
       loadRecentChats();
    });

    function escapeHtml(s) { return s ? s.toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) : ''; }
  </script>
</body>
</html>
