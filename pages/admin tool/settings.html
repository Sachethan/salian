<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analytics Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .toast {
      visibility: hidden; opacity: 0; transform: translateY(-1rem);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .toast.show { visibility: visible; opacity: 1; transform: translateY(0); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .custom-checkbox {
      appearance: none; background-color: #fff; margin: 0; font: inherit; color: currentColor;
      width: 1.15em; height: 1.15em; border: 2px solid #cbd5e1; border-radius: 0.25em;
      display: grid; place-content: center; transition: all 0.2s ease-in-out; cursor: pointer;
    }
    .custom-checkbox::before {
      content: ""; width: 0.65em; height: 0.65em; transform: scale(0);
      transition: 120ms transform ease-in-out; box-shadow: inset 1em 1em white;
      transform-origin: center;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }
    .custom-checkbox:checked { background-color: #4f46e5; border-color: #4f46e5; }
    .custom-checkbox:checked::before { transform: scale(1); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased p-4 md:p-8 min-h-screen">

  <!-- Toast Notification -->
  <div id="toast" class="toast fixed top-6 right-6 z-50 flex items-center w-full max-w-xs p-4 space-x-3 text-slate-500 bg-white rounded-lg shadow-lg border border-slate-200">
    <div id="toastIcon" class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-indigo-500 bg-indigo-100 rounded-lg">
      <i data-lucide="info" class="w-5 h-5"></i>
    </div>
    <div class="ml-3 text-sm font-normal" id="toastMessage">Notification message</div>
  </div>

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex items-center space-x-3 mb-8">
      <div class="p-3 bg-indigo-600 rounded-lg shadow-sm">
        <i data-lucide="bar-chart-3" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Analytics Dashboard</h1>
        <p class="text-slate-500 text-sm">Monitor traffic across all your tracked pages</p>
      </div>
    </header>

    <!-- Visitor Tracking Status Card -->
    <div class="bg-white border border-slate-200 shadow-sm rounded-xl overflow-hidden flex flex-col">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-blue-50 text-blue-600 rounded-lg">
            <i data-lucide="activity" class="w-5 h-5"></i>
          </div>
          <h2 class="font-semibold text-slate-800">Global Tracking Status</h2>
        </div>
        <span id="trackingStatusBadge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">
          Loading...
        </span>
      </div>
      
      <div class="p-6 flex-1 flex flex-col justify-center items-start space-y-4">
        <p class="text-slate-500 text-sm">
          Master switch. If disabled, NO visits will be recorded on ANY page.
        </p>
        <div class="w-full flex items-center justify-between bg-slate-50 p-4 rounded-lg border border-slate-100">
          <span class="text-sm font-medium text-slate-700">Active Monitoring</span>
          <button onclick="toggleTracking()" id="trackingButton" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none transition-colors shadow-sm">
            Toggle Status
          </button>
        </div>
      </div>
    </div>

    <!-- Visitor Logs Card -->
    <div class="bg-white border border-slate-200 shadow-sm rounded-xl overflow-hidden flex flex-col">
      <!-- Toolbar Header -->
      <div class="p-4 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between bg-white sticky top-0 z-10 gap-4">
        
        <!-- Left: Title and Page Selector -->
        <div class="flex items-center space-x-4">
          <div class="p-2 bg-purple-50 text-purple-600 rounded-lg shrink-0">
            <i data-lucide="layers" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="font-semibold text-slate-800">Visitor Logs</h2>
            <div class="flex items-center mt-0.5">
                <span class="text-xs text-slate-500 mr-2">Select Page:</span>
                <div class="relative">
                    <select id="pageSelector" onchange="changePage()" class="appearance-none bg-slate-50 border border-slate-200 text-slate-700 text-xs font-medium rounded pl-2 pr-8 py-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full cursor-pointer hover:bg-slate-100 transition-colors min-w-[200px]">
                        <option value="" disabled selected>Loading Pages...</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                        <i data-lucide="chevron-down" class="w-3 h-3"></i>
                    </div>
                </div>
            </div>
          </div>
        </div>
        
        <!-- Right: Bulk Actions & Status -->
        <div class="flex items-center space-x-3 self-end md:self-auto">
           <button id="deleteSelectedBtn" onclick="deleteSelectedLogs()" class="hidden items-center px-3 py-1.5 text-xs font-medium text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-lg transition-colors">
            <i data-lucide="trash-2" class="w-3 h-3 mr-1.5"></i>
            Delete Selected (<span id="selectedCount">0</span>)
          </button>
          <div class="text-xs font-medium text-slate-400 bg-slate-50 px-2 py-1 rounded border border-slate-100 flex items-center">
            <div class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></div> Live
          </div>
        </div>
      </div>

      <!-- Select All Row -->
      <div class="bg-slate-50 border-b border-slate-100 px-6 py-2 flex items-center justify-between">
        <div class="flex items-center">
            <input type="checkbox" id="selectAllCheckbox" class="custom-checkbox text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded" onchange="toggleSelectAll()">
            <label for="selectAllCheckbox" class="ml-3 text-xs font-semibold text-slate-500 uppercase tracking-wider cursor-pointer">Select All</label>
        </div>
        <span id="current-page-label" class="text-xs text-slate-400 font-mono hidden md:block"></span>
      </div>
      
      <!-- List -->
      <div class="p-0">
        <ul id="visitorList" class="divide-y divide-slate-100 max-h-[600px] overflow-y-auto custom-scrollbar">
          <li class="p-8 text-center text-slate-500 flex flex-col items-center">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-indigo-500 mb-2"></i>
            <span>Initializing...</span>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import {
      getFirestore, collection, doc, updateDoc, setDoc, onSnapshot, getDoc, getDocs, deleteDoc, writeBatch
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCZejpQv-Ru-OlzWsjzFF_37e8b8DIC3u8",
      authDomain: "posterdata-113da.firebaseapp.com",
      projectId: "posterdata-113da",
      storageBucket: "posterdata-113da.appspot.com",
      messagingSenderId: "702186025024",
      appId: "1:702186025024:web:488eec752f7f6c382cefa5",
      measurementId: "G-YQHKJTNHKG"
    };

    // Initialize Firebase app
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Initialize Icons
    lucide.createIcons();

    // State
    let selectedLogIds = new Set();
    let currentLogIds = []; 
    let currentPageId = ""; 
    let unsubscribeLogs = null; 

    // Date Formatter Helper
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    
    function formatDate(dateInput) {
        if (!dateInput) return "";
        let date;
        // Handle Firestore Timestamp or ISO string
        if (dateInput.seconds) {
            date = new Date(dateInput.seconds * 1000);
        } else {
            date = new Date(dateInput);
        }
        
        if (isNaN(date.getTime())) return "Invalid Date";

        const day = String(date.getDate()).padStart(2, '0');
        const month = months[date.getMonth()];
        const year = date.getFullYear();
        let hours = date.getHours();
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; 
        return `${day}-${month}-${year} ${hours}:${minutes} ${ampm}`;
    }

    // UI Helpers
    function showToast(message, type = 'info') {
      const toast = document.getElementById("toast");
      const toastMessage = document.getElementById("toastMessage");
      const toastIcon = document.getElementById("toastIcon");
      toastMessage.textContent = message;
      
      if (type === 'success') {
        toastIcon.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i>';
        toastIcon.className = "inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-emerald-500 bg-emerald-100 rounded-lg";
      } else if (type === 'error') {
        toastIcon.innerHTML = '<i data-lucide="alert-circle" class="w-5 h-5"></i>';
        toastIcon.className = "inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-red-500 bg-red-100 rounded-lg";
      } else {
        toastIcon.innerHTML = '<i data-lucide="info" class="w-5 h-5"></i>';
        toastIcon.className = "inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-indigo-500 bg-indigo-100 rounded-lg";
      }
      lucide.createIcons();
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // --- Page Management (Dynamic) ---

    async function loadPages() {
        const select = document.getElementById('pageSelector');
        
        try {
            // Get all existing documents in 'visitor_logs'
            const querySnapshot = await getDocs(collection(db, "visitor_logs"));
            
            select.innerHTML = "";
            let pages = [];
            
            querySnapshot.forEach((doc) => {
                pages.push(doc.id);
            });

            if (pages.length === 0) {
                const option = document.createElement("option");
                option.text = "No pages tracked yet";
                select.appendChild(option);
            } else {
                pages.forEach(page => {
                    const option = document.createElement("option");
                    option.value = page;
                    option.text = page;
                    select.appendChild(option);
                });
                
                // Select first one by default
                currentPageId = pages[0];
                loadVisitorLogs(currentPageId);
            }
            lucide.createIcons();
            
        } catch (error) {
            console.error("Error loading pages:", error);
            select.innerHTML = `<option>Error loading pages</option>`;
        }
    }

    window.changePage = function() {
        const select = document.getElementById('pageSelector');
        currentPageId = select.value;
        loadVisitorLogs(currentPageId);
    }

    // --- Log Management ---

    function loadVisitorLogs(pageId) {
      if (!pageId) return;
      document.getElementById('current-page-label').textContent = pageId;

      if (unsubscribeLogs) unsubscribeLogs();
      selectedLogIds.clear();
      updateBulkDeleteUI();
      document.getElementById('selectAllCheckbox').checked = false;

      const list = document.getElementById("visitorList");
      list.innerHTML = `
        <li class="p-8 text-center text-slate-500 flex flex-col items-center">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-indigo-500 mb-2"></i>
            <span>Loading logs...</span>
        </li>`;
      lucide.createIcons();

      const visitorsRef = collection(db, "visitor_logs", pageId, "visitors");

      unsubscribeLogs = onSnapshot(visitorsRef, (snapshot) => {
        list.innerHTML = "";
        currentLogIds = [];

        if (snapshot.empty) {
          list.innerHTML = `
            <li class="p-8 text-center text-slate-400 flex flex-col items-center">
              <i data-lucide="inbox" class="w-8 h-8 mb-2 opacity-50"></i>
              <span>No visitors recorded yet.<br><small class="text-xs">Tracking must be active & pages visited.</small></span>
            </li>`;
          lucide.createIcons();
          return;
        }

        // Sort locally by most recent visit
        const docs = [];
        snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
        
        // Sort: newest timestamp in visits array wins
        docs.sort((a, b) => {
            const lastA = a.visits && a.visits.length ? new Date(a.visits[a.visits.length - 1]) : new Date(0);
            const lastB = b.visits && b.visits.length ? new Date(b.visits[b.visits.length - 1]) : new Date(0);
            return lastB - lastA; // Descending
        });

        docs.forEach(data => {
          const id = data.id;
          currentLogIds.push(id);
          const li = document.createElement("li");
          li.className = "p-4 hover:bg-slate-50 transition-colors group";
          
          const visits = data.visits || [];
          // Show last 3 visits
          const visitTimes = visits.slice(-3).reverse().map(v => 
            `<span class="text-xs bg-white border border-slate-200 text-slate-600 px-2 py-1 rounded-md whitespace-nowrap">${formatDate(v)}</span>`
          ).join('');

          const isChecked = selectedLogIds.has(id) ? 'checked' : '';

          li.innerHTML = `
            <div class="flex items-start gap-4">
              <div class="pt-1">
                 <input type="checkbox" class="log-checkbox custom-checkbox" value="${id}" ${isChecked} onchange="toggleSelection('${id}')">
              </div>

              <div class="flex-1 flex flex-col md:flex-row md:items-start gap-4 min-w-0">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center space-x-2 mb-1">
                    <span class="inline-flex items-center justify-center h-6 w-6 rounded-full bg-indigo-50 text-indigo-600">
                      <i data-lucide="user" class="w-3 h-3"></i>
                    </span>
                    <p class="text-sm font-semibold text-slate-900 truncate" title="${data.visitor_id}">${data.visitor_id}</p>
                  </div>
                  <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-slate-500 ml-8">
                    <span class="flex items-center"><i data-lucide="hash" class="w-3 h-3 mr-1"></i> Visits: ${data.visitCount || 0}</span>
                    <span class="flex items-center"><i data-lucide="monitor" class="w-3 h-3 mr-1"></i> ${data.screenWidth || '?'}×${data.screenHeight || '?'}</span>
                  </div>
                </div>
                <div class="flex-1 md:text-right flex flex-col md:items-end gap-1">
                   <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Recent Activity</span>
                   <div class="flex flex-wrap gap-1 justify-end">${visitTimes}</div>
                </div>
              </div>

              <div class="pt-0.5">
                  <button onclick="deleteLog('${id}')" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            </div>
          `;
          list.appendChild(li);
        });
        
        lucide.createIcons();
        updateBulkDeleteUI(); 
      }, (error) => {
        console.error(error);
        list.innerHTML = `<li class="p-4 text-red-500 text-center text-sm">Failed: ${error.message}</li>`;
      });
    }

    // --- Bulk Actions ---

    function updateBulkDeleteUI() {
        const btn = document.getElementById('deleteSelectedBtn');
        const countSpan = document.getElementById('selectedCount');
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        
        countSpan.textContent = selectedLogIds.size;
        
        if (selectedLogIds.size > 0) {
            btn.classList.remove('hidden'); btn.classList.add('inline-flex');
        } else {
            btn.classList.add('hidden'); btn.classList.remove('inline-flex');
        }

        if (currentLogIds.length > 0 && selectedLogIds.size === currentLogIds.length) {
            selectAllCheckbox.checked = true; selectAllCheckbox.indeterminate = false;
        } else if (selectedLogIds.size > 0) {
            selectAllCheckbox.checked = false; selectAllCheckbox.indeterminate = true;
        } else {
            selectAllCheckbox.checked = false; selectAllCheckbox.indeterminate = false;
        }
    }

    window.toggleSelection = function(id) {
        if (selectedLogIds.has(id)) selectedLogIds.delete(id);
        else selectedLogIds.add(id);
        updateBulkDeleteUI();
    }

    window.toggleSelectAll = function() {
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        if (selectAllCheckbox.checked) currentLogIds.forEach(id => selectedLogIds.add(id));
        else selectedLogIds.clear();
        document.querySelectorAll('.log-checkbox').forEach(cb => cb.checked = selectAllCheckbox.checked);
        updateBulkDeleteUI();
    }

    window.deleteLog = async function(id) {
        if (!confirm("Delete this log?")) return;
        try {
            await deleteDoc(doc(db, "visitor_logs", currentPageId, "visitors", id));
            showToast("Log deleted", "success");
            selectedLogIds.delete(id); updateBulkDeleteUI();
        } catch (error) { showToast("Failed to delete", "error"); }
    }

    window.deleteSelectedLogs = async function() {
        if (selectedLogIds.size === 0) return;
        if (!confirm(`Delete ${selectedLogIds.size} logs?`)) return;

        const btn = document.getElementById('deleteSelectedBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 animate-spin mr-1.5"></i> Deleting...`;
        lucide.createIcons();

        try {
            const batch = writeBatch(db);
            selectedLogIds.forEach(id => {
                batch.delete(doc(db, "visitor_logs", currentPageId, "visitors", id));
            });
            await batch.commit();
            showToast(`Deleted ${selectedLogIds.size} logs`, "success");
            selectedLogIds.clear(); updateBulkDeleteUI();
            document.getElementById('selectAllCheckbox').checked = false;
        } catch (error) {
            console.error(error); showToast("Failed to delete", "error");
        } finally {
             btn.innerHTML = originalText; lucide.createIcons();
        }
    }

    // --- Tracking Status ---

    function loadTrackingStatus() {
      const configRef = doc(db, "settings", "config");
      onSnapshot(configRef, (docSnap) => {
        const statusBadge = document.getElementById("trackingStatusBadge");
        if (docSnap.exists()) {
          const enabled = docSnap.data().tracking_enabled;
          if (enabled) {
            statusBadge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 border border-emerald-200";
            statusBadge.innerHTML = `<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full mr-1.5"></span>Active`;
          } else {
            statusBadge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-100 text-rose-800 border border-rose-200";
            statusBadge.innerHTML = `<span class="w-1.5 h-1.5 bg-rose-500 rounded-full mr-1.5"></span>Disabled`;
          }
        } else {
          statusBadge.textContent = "Unknown";
        }
      });
    }

    window.toggleTracking = async function () {
      const btn = document.getElementById('trackingButton');
      btn.disabled = true;
      try {
        const docRef = doc(db, "settings", "config");
        const docSnap = await getDoc(docRef);
        let newState = true;
        if (docSnap.exists()) {
          newState = !docSnap.data().tracking_enabled;
          await updateDoc(docRef, { tracking_enabled: newState });
        } else {
            await setDoc(docRef, { tracking_enabled: true });
        }
        showToast(`Tracking ${newState ? 'enabled' : 'disabled'}`, 'success');
      } catch (error) { showToast("Failed to toggle", "error"); } 
      finally { btn.disabled = false; }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadTrackingStatus();
      loadPages();
    });
  </script>
</body>
</html>
