<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sachethan Salian - Template Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            900: '#0f172a', /* Slate 900 */
                            800: '#1e293b', /* Slate 800 */
                            700: '#334155', /* Slate 700 */
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Smooth fading */
        .loader-fade-out {
            opacity: 0;
            transition: opacity 0.4s ease-out;
            pointer-events: none;
        }

        /* Custom Scrollbar for Dark Mode */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }

        /* Iframe Container Logic */
        #iframe-container.dynamic-height {
            height: calc(100vh - 96px); /* Subtract new header height (h-24 = 96px) */
        }
        
        /* Loading Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            border-top-color: #6366f1; /* Indigo */
            animation: spin 0.8s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Card Hover Effect */
        .template-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .template-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border-color: #6366f1; /* Indigo border on hover */
        }

        /* Gradient Text */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #818cf8, #c084fc, #22d3ee);
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-200 flex flex-col h-screen overflow-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Header / Navigation -->
    <!-- Increased Height to h-24 (96px) and added gradient background -->
    <header class="h-12 flex-shrink-0 z-30 relative border-b border-slate-700/50 bg-dark-900/90 backdrop-blur-md shadow-lg">
        <div class="absolute inset-0 bg-gradient-to-r from-indigo-900/20 via-purple-900/20 to-slate-900/20 pointer-events-none"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex items-center justify-between relative">
            <div class="flex items-center gap-6">
                <button onclick="window.history.back()" 
                    class="group flex items-center justify-center p-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all focus:outline-none border border-transparent hover:border-slate-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>
                
                <div class="flex flex-col justify-center">
                    <h1 id="page-title" class="text-1xl font-bold tracking-tight text-white">
                        Template <span class="text-gradient">Studio</span>
                    </h1>
                    <p class="text-xs text-slate-500 uppercase tracking-widest font-semibold mt-0.5">Design Suite</p>
                </div>
            </div>
            
            <!-- Breadcrumb for Editor Mode (Hidden by default) -->
            <nav id="editor-nav" class="hidden text-sm font-medium bg-slate-800/50 px-4 py-2 rounded-full border border-slate-700">
                <span class="text-slate-400">Editing:</span>
                <span id="template-breadcrumb" class="text-indigo-400 ml-2 font-semibold tracking-wide">Untitled</span>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow relative h-full overflow-hidden bg-gradient-to-br from-dark-900 to-slate-900">
        
        <!-- Scrollable Template List Container -->
        <div id="template-selector" class="h-full overflow-y-auto scroll-smooth">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 pb-24">
                <!-- Toolbar: Search & Filter -->
                <div class="mb-10 flex flex-col md:flex-row justify-between items-center gap-4 bg-dark-800/50 p-2 rounded-2xl border border-slate-700/50 backdrop-blur-sm sticky top-0 z-40 shadow-xl">
                    
                    <!-- Search Input -->
                    <div class="relative w-full md:w-96 group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-500 group-focus-within:text-indigo-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input type="text" id="search-input" placeholder="Search templates..."
                            class="w-full pl-10 pr-10 py-3 bg-dark-900 border border-transparent focus:border-indigo-500 rounded-xl focus:ring-2 focus:ring-indigo-500/20 text-sm text-slate-200 placeholder-slate-500 transition-all outline-none">
                        <button id="clear-search-btn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-white hidden transition-colors">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>

                    <!-- Category Tabs -->
                    <div class="flex space-x-1 bg-dark-900 p-1.5 rounded-xl w-full md:w-auto overflow-x-auto border border-slate-800">
                        <button data-category="all" class="tab-button flex-1 md:flex-none px-6 py-2.5 rounded-lg text-sm font-medium transition-all duration-200">
                            All
                        </button>
                        <button data-category="devotional" class="tab-button flex-1 md:flex-none px-6 py-2.5 rounded-lg text-sm font-medium transition-all duration-200">
                            Devotional
                        </button>
                        <button data-category="favorite" class="tab-button flex-1 md:flex-none px-6 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2">
                            <span>Favorites</span>
                            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.532.96-.532 1.26 0l2.365 4.103a.75.75 0 00.65.362h4.73a.75.75 0 01.65 1.088l-3.83 3.166a.75.75 0 00-.24.788l1.45 4.54a.75.75 0 01-1.15 1.01l-4.06-2.5a.75.75 0 00-.81 0l-4.06 2.5a.75.75 0 01-1.15-1.01l1.45-4.54a.75.75 0 00-.24-.788L2.094 8.48a.75.75 0 01.65-1.088h4.73a.75.75 0 00.65-.362l2.365-4.103z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Template Grid -->
                <div id="template-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                    <!-- Cards injected via JS -->
                </div>

                <!-- Loading State (Skeleton) -->
                <div id="templateLoader" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 opacity-100 transition-opacity duration-300">
                    <!-- Skeleton Card 1 -->
                    <div class="bg-dark-800 rounded-2xl border border-slate-700 p-5 space-y-4 shadow-lg">
                        <div class="h-44 bg-slate-700/50 rounded-xl animate-pulse"></div>
                        <div class="space-y-3">
                            <div class="h-6 w-3/4 bg-slate-700/50 rounded animate-pulse"></div>
                            <div class="h-4 w-1/2 bg-slate-700/50 rounded animate-pulse"></div>
                        </div>
                    </div>
                    <!-- Skeleton Card 2 -->
                    <div class="bg-dark-800 rounded-2xl border border-slate-700 p-5 space-y-4 shadow-lg hidden sm:block">
                        <div class="h-44 bg-slate-700/50 rounded-xl animate-pulse"></div>
                        <div class="space-y-3">
                            <div class="h-6 w-3/4 bg-slate-700/50 rounded animate-pulse"></div>
                            <div class="h-4 w-1/2 bg-slate-700/50 rounded animate-pulse"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Iframe Viewer Container -->
        <div id="iframe-container" class="hidden absolute inset-0 bg-dark-900 z-40">
            <!-- Loading Overlay for Iframe -->
            <div id="loading-overlay" class="absolute inset-0 bg-dark-900/95 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300">
                <div class="flex flex-col items-center">
                    <div class="spinner mb-6"></div>
                    <p class="text-lg font-medium text-slate-300 animate-pulse tracking-wide">Loading Studio...</p>
                </div>
            </div>
            <iframe id="viewer" src="about:blank" title="Editor" class="w-full h-full border-0"></iframe>
        </div>

    </main>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm overflow-y-auto h-full w-full z-50 hidden flex items-center justify-center">
        <div class="bg-dark-800 border border-slate-700 rounded-2xl shadow-2xl p-8 w-96 max-w-full m-4 transform transition-all scale-100 ring-1 ring-white/10">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-amber-500/10 mb-6">
                    <svg class="h-7 w-7 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-white">Leave Editor?</h3>
                <p class="text-slate-400 mt-3 leading-relaxed">
                    Any unsaved changes will be lost. Are you sure you want to go back to the gallery?
                </p>
                <div class="mt-8 flex gap-3 justify-center">
                    <button id="cancel-btn" class="px-5 py-2.5 bg-slate-700 text-slate-200 text-sm font-medium rounded-xl hover:bg-slate-600 focus:outline-none transition-colors">
                        Stay here
                    </button>
                    <button id="confirm-back-btn" class="px-5 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-xl hover:bg-indigo-500 focus:outline-none shadow-lg shadow-indigo-900/50 transition-colors">
                        Leave & Discard
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- DATA ---
            const templates = [
                {
                    id: 'poster-anna-poorna',
                    title: 'ಅನ್ನಪೂರ್ಣ ಆಶೀರ್ವಾದ - Poster',
                    description: 'A poster editor for the Annapoorna Seva Samithi event.',
                    previewImage: 'annapoorna/image/preview.jpg',
                    url: 'annapoorna/annapoorna1.html',
                    url2: 'annapoorna/report.html',
                    category: 'devotional',
                    isFavorite: false
                },
                {
                    id: 'poster-sarapady',
                    title: 'ಶ್ರೀ ಶರಭೇಶ್ವರ ಭಜನೆ - Poster',
                    description: 'A poster editor for the Sarapady event.',
                    previewImage: 'sharabeswara/image/preview.png',
                    url: 'sharabeswara/sharabeswara.html',
                    category: 'devotional',
                    isFavorite: false
                },
            ];

            // --- DOM Elements ---
            const templateSelector = document.getElementById('template-selector');
            const iframeContainer = document.getElementById('iframe-container');
            const viewerIframe = document.getElementById('viewer');
            const loadingOverlay = document.getElementById('loading-overlay');
            
            const pageTitle = document.getElementById('page-title').parentElement; // Get parent div of title
            const editorNav = document.getElementById('editor-nav');
            const templateBreadcrumb = document.getElementById('template-breadcrumb');
            
            const confirmationModal = document.getElementById('confirmation-modal');
            const confirmBackBtn = document.getElementById('confirm-back-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            
            const templateGrid = document.getElementById('template-grid');
            const templateLoader = document.getElementById('templateLoader');
            
            const searchInput = document.getElementById('search-input');
            const clearSearchBtn = document.getElementById('clear-search-btn');
            const tabButtons = document.querySelectorAll('.tab-button');
            const backButton = document.querySelector('header button'); // Back button in header

            // --- State ---
            const blankPageUrl = 'about:blank';
            let currentSearchQuery = '';
            let currentCategory = 'all';

            // --- Messaging ---
            window.parent.postMessage({
                type: "showMessage",
                message: `Welcome to the Studio. Select a template to begin.`,
                variant: "info"
            }, "*");

            // --- URL Params Handling ---
            const urlParams = new URLSearchParams(window.location.search);
            const openId = urlParams.get('open');
            const overrideUrl = urlParams.get('override');

            if (openId) {
                const template = templates.find(t => t.id === openId);
                if (template) {
                    if (overrideUrl) template.url = overrideUrl;
                    if (template.url !== blankPageUrl) {
                        showEditor(template.url, template.title);
                    }
                }
            }

            // --- Functions ---

            function loadFavorites() {
                const favoriteTemplateIds = JSON.parse(localStorage.getItem('favoriteTemplates') || '[]');
                templates.forEach(template => {
                    template.isFavorite = favoriteTemplateIds.includes(template.id);
                });
            }

            function saveFavorites() {
                const favoriteIds = templates.filter(t => t.isFavorite).map(t => t.id);
                localStorage.setItem('favoriteTemplates', JSON.stringify(favoriteIds));
            }

            function renderTemplates(templatesToRender) {
                templateGrid.innerHTML = '';
                templateLoader.classList.add('hidden'); // Hide skeleton
                
                if (!templatesToRender || templatesToRender.length === 0) {
                    templateGrid.innerHTML = `
                      <div class="col-span-full text-center py-20">
                        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-800 mb-6 border border-slate-700">
                            <svg class="w-10 h-10 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <h3 class="text-xl font-semibold text-white">No templates found</h3>
                        <p class="text-slate-500 mt-2">Try adjusting your search or category filter.</p>
                      </div>
                    `;
                    return;
                }

                templatesToRender.forEach(template => {
                    const card = document.createElement('div');
                    card.className = 'template-card group bg-dark-800 border border-slate-700/50 rounded-2xl overflow-hidden flex flex-col h-full shadow-lg hover:shadow-indigo-500/10';

                    const isDisabled = template.url === blankPageUrl;
                    
                    // Button Logic
                    let actionBtn = '';
                    if (isDisabled) {
                        actionBtn = `
                        <button disabled class="w-full py-2.5 px-4 bg-slate-700/50 text-slate-500 text-sm font-medium rounded-xl cursor-not-allowed border border-transparent">
                            Coming Soon
                        </button>`;
                    } else {
                        actionBtn = `
                        <button class="flex-1 py-2.5 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-sm font-semibold rounded-xl shadow-md hover:shadow-indigo-500/30 transition-all duration-200 focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-indigo-500"
                            data-url="${template.url}"
                            data-title="${template.title}">
                            Open Editor
                        </button>`;
                    }

                    // Fallback Image Logic
                    const fallbackImg = "https://placehold.co/600x400/1e293b/475569?text=No+Preview";

                    card.innerHTML = `
                      <div class="relative aspect-[16/9] bg-slate-900 overflow-hidden border-b border-slate-700/50">
                        <div class="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-colors z-10 pointer-events-none"></div>
                        <img src="${template.previewImage}" alt="${template.title}" 
                             class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700 opacity-90 group-hover:opacity-100"
                             onerror="this.onerror=null;this.src='${fallbackImg}';">
                        
                        <!-- Floating Favorite Button -->
                        <button class="favorite-button absolute top-3 right-3 p-2.5 rounded-full bg-slate-900/80 backdrop-blur-md shadow-lg hover:bg-slate-800 transition-all duration-200 z-20 border border-white/10 ${template.isFavorite ? 'text-amber-400' : 'text-slate-400 hover:text-amber-400'}"
                            data-template-id="${template.id}"
                            title="${template.isFavorite ? 'Remove Favorite' : 'Add Favorite'}">
                            <svg class="w-5 h-5" fill="${template.isFavorite ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </button>
                      </div>
                      
                      <div class="p-6 flex flex-col flex-grow">
                        <div class="mb-5">
                            <h3 class="text-lg font-bold text-white line-clamp-1 mb-1" title="${template.title}">${template.title}</h3>
                            <p class="text-sm text-slate-400 line-clamp-2 leading-relaxed h-10">${template.description}</p>
                        </div>
                        
                        <div class="mt-auto pt-5 flex gap-3 border-t border-slate-700/50">
                          ${actionBtn}
                        </div>
                      </div>
                    `;

                    templateGrid.appendChild(card);
                });
            }

            function filterAndRenderTemplates() {
                const lowerCaseQuery = currentSearchQuery.toLowerCase();
                const filtered = templates.filter(template => {
                    const matchesSearch = template.title.toLowerCase().includes(lowerCaseQuery) ||
                                          template.description.toLowerCase().includes(lowerCaseQuery);

                    let matchesCategory = false;
                    if (currentCategory === 'all') matchesCategory = true;
                    else if (currentCategory === 'favorite') matchesCategory = template.isFavorite;
                    else matchesCategory = template.category === currentCategory;
                    
                    return matchesSearch && matchesCategory;
                });
                renderTemplates(filtered);
            }

            function updateActiveTab() {
                tabButtons.forEach(button => {
                    const isSelected = button.dataset.category === currentCategory;
                    if (isSelected) {
                        button.classList.remove('text-slate-400', 'hover:bg-slate-800', 'hover:text-white', 'bg-transparent');
                        button.classList.add('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-900/50');
                    } else {
                        button.classList.add('text-slate-400', 'hover:bg-slate-800', 'hover:text-white', 'bg-transparent');
                        button.classList.remove('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-900/50');
                    }
                });
            }

            function hideLoader() {
                loadingOverlay.classList.add('loader-fade-out');
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                    loadingOverlay.classList.remove('loader-fade-out'); // Reset for next time
                }, 400);
            }

            function showEditor(url, title) {
                // Reset loading state
                loadingOverlay.classList.remove('hidden');
                loadingOverlay.style.opacity = '1';

                // Switch Views
                templateSelector.classList.add('hidden');
                iframeContainer.classList.remove('hidden');
                
                // Update Header
                pageTitle.classList.add('hidden');
                editorNav.classList.remove('hidden');
                editorNav.classList.add('inline-flex', 'items-center');
                templateBreadcrumb.textContent = title;

                // Load Content
                viewerIframe.src = url;
            }

            function showTemplateSelector() {
                viewerIframe.src = blankPageUrl;
                
                templateSelector.classList.remove('hidden');
                iframeContainer.classList.add('hidden');
                
                // Reset Header
                pageTitle.classList.remove('hidden');
                editorNav.classList.add('hidden');
                editorNav.classList.remove('inline-flex', 'items-center');

                closeConfirmationModal();
            }

            // --- Header Back Button Logic ---
            backButton.onclick = (e) => {
                e.preventDefault();
                if (!iframeContainer.classList.contains('hidden')) {
                    // We are in editor mode
                    confirmationModal.classList.remove('hidden');
                } else {
                    // We are in gallery mode
                    window.history.back();
                }
            };

            function closeConfirmationModal() {
                confirmationModal.classList.add('hidden');
            }

            // --- Event Listeners ---
            viewerIframe.addEventListener('load', hideLoader);

            templateGrid.addEventListener('click', (e) => {
                const favBtn = e.target.closest('.favorite-button');
                if (favBtn) {
                    const id = favBtn.dataset.templateId;
                    const tmpl = templates.find(t => t.id === id);
                    if (tmpl) {
                        tmpl.isFavorite = !tmpl.isFavorite;
                        saveFavorites();
                        if (currentCategory === 'favorite') {
                            filterAndRenderTemplates();
                        } else {
                            // Quick visual toggle
                            favBtn.classList.toggle('text-amber-400');
                            favBtn.classList.toggle('text-slate-400');
                            favBtn.querySelector('svg').setAttribute('fill', tmpl.isFavorite ? 'currentColor' : 'none');
                            favBtn.title = tmpl.isFavorite ? 'Remove Favorite' : 'Add Favorite';
                        }
                    }
                    return;
                }

                const openBtn = e.target.closest('button[data-url]');
                if (openBtn) {
                    const { url, title } = openBtn.dataset;
                    if (openBtn.disabled) return;
                    if (url && url !== blankPageUrl) {
                        showEditor(url, title);
                    }
                }
            });

            confirmBackBtn.addEventListener('click', showTemplateSelector);
            cancelBtn.addEventListener('click', closeConfirmationModal);
            
            confirmationModal.addEventListener('click', (e) => {
                if (e.target === confirmationModal) closeConfirmationModal();
            });

            // Search
            searchInput.addEventListener('input', (e) => {
                currentSearchQuery = e.target.value;
                clearSearchBtn.classList.toggle('hidden', currentSearchQuery.length === 0);
                filterAndRenderTemplates();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                currentSearchQuery = '';
                clearSearchBtn.classList.add('hidden');
                filterAndRenderTemplates();
            });

            // Tabs
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    currentCategory = button.dataset.category;
                    localStorage.setItem('lastCategory', currentCategory);
                    updateActiveTab();
                    filterAndRenderTemplates();
                });
            });

            // --- Init ---
            loadFavorites();
            const savedCategory = localStorage.getItem('lastCategory');
            currentCategory = savedCategory || 'all';
            
            // Artificial delay for smooth initial load
            setTimeout(() => {
                updateActiveTab();
                filterAndRenderTemplates();
            }, 600);
        });
    </script>
</body>
</html>
