.flex-grow {
    /* Corrected to background-image, and using a shorthand 'background' is often easier */
    background: linear-gradient(90deg, rgba(252, 254, 255, 1) 0%, rgba(251, 255, 222, 1) 51%, rgb(245, 164, 3) 100%);
    /* Define the animation */
    animation: gradient-shift 10s ease-in-out infinite alternate;
    /* Optional: Ensure the background covers the entire element */
    background-size: 400% 400%; 
}

@keyframes gradient-shift {
    0% {
        /* Start position - the gradient is aligned to the top-left */
        background-position: 0% 50%;
    }
    50% {
        /* Middle position - the gradient is centered */
        background-position: 100% 50%;
    }
    100% {
        /* End position - the gradient is aligned to the bottom-right */
        background-position: 0% 50%;
    }
}
        /* Custom height for iframe container to fill available space below the sub-header */

        }
        /* Custom scrollbar for main content */

            width: 8px;

            border-radius: 10px;
        }

            background: #888;
            border-radius: 10px;
        }

            background: #555;
        }

.blink {
    animation: blinkAnim 2s infinite;
}

@keyframes blinkAnim {
    0%, 50%, 100% { opacity: 1; }
    25%, 75% { opacity: 0; }
}

/* Custom CSS to be included in your stylesheet */
.btn-pulse {
  /* Initial state: A strong shadow for depth */
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); 
  /* Apply the animation */
  animation: pulse-shadow 2s infinite ease-in-out;
  /* Optimization */
  will-change: box-shadow; 
}

@keyframes pulse-shadow {
  0% {
    /* Base shadow: default blue color */
    box-shadow: 0 0 0 0 rgba(255, 72, 0, 0.7); /* Indigo-600 with high opacity */
  }
  50% {
    /* Maximum pulse: larger and more transparent shadow */
    box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); /* Same color, fades out */
  }
  100% {
    /* Return to base, ready to repeat */
    box-shadow: 0 0 0 0 rgb(255, 174, 0);
  }
}

            /**
             * Filters templates based on current search query and category, then renders them.
             */
            function filterAndRenderTemplates() {
                const lowerCaseQuery = currentSearchQuery.toLowerCase();
                const filtered = templates.filter(template => {
                    const matchesSearch = template.title.toLowerCase().includes(lowerCaseQuery) ||
                                          template.description.toLowerCase().includes(lowerCaseQuery);

                    let matchesCategory = false;
                    if (currentCategory === 'all') {
                        matchesCategory = true;
                    } else if (currentCategory === 'favorite') {
                        matchesCategory = template.isFavorite;
                    } else { // 'devotional' or any other specific category
                        matchesCategory = template.category === currentCategory;
                    }
                    return matchesSearch && matchesCategory;
                });
                renderTemplates(filtered);
            }

            /**
             * Updates the active tab styling.
             */
            function updateActiveTab() {
                tabButtons.forEach(button => {
                    if (button.dataset.category === currentCategory) {
                        button.classList.add('bg-white', 'shadow-sm');
                        button.classList.remove('bg-slate-200');
                    } else {
                        button.classList.remove('bg-white', 'shadow-sm');
                        button.classList.add('bg-slate-200');
                    }
                });
            }

             * Hides the loading overlay with a fade-out effect.
             */
            function hideLoader() {
                loadingOverlay.classList.add('loader-fade-out');
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                }, 500); // Match transition duration in CSS
            }

            /**
             * Switches the view to the editor iframe.
             * @param {string} url - The URL of the template to load.
             * @param {string} title - The title of the template for the breadcrumb.
             */
function showEditor(url, title) {
  loadingOverlay.classList.remove('hidden', 'loader-fade-out');
  loadingOverlay.style.opacity = '1';

  templateSelector.classList.add('hidden');
  iframeContainer.classList.remove('hidden');
  subHeader.classList.remove('hidden');

  document.documentElement.style.setProperty('--subheader-height', `${subHeader.offsetHeight}px`);
  iframeContainer.classList.add('dynamic-height');

  templateBreadcrumb.textContent = title;
  viewerIframe.src = url;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

            /**
             * Switches the view back to the template selector.
             */
function showTemplateSelector() {
  viewerIframe.src = blankPageUrl;

  templateSelector.classList.remove('hidden');
  iframeContainer.classList.add('hidden');
  subHeader.classList.add('hidden');

  closeConfirmationModal();
}


            /**
             * Shows the confirmation modal if the editor is active.
             */
            function openConfirmationModal() {
                if (!iframeContainer.classList.contains('hidden')) {
                    confirmationModal.classList.remove('hidden');
                } else {
                    showTemplateSelector();
                }
            }

            /**
             * Hides the confirmation modal.
             */
            function closeConfirmationModal() {
                confirmationModal.classList.add('hidden');
            }

            // --- Event Listeners ---
            viewerIframe.addEventListener('load', hideLoader);

            templateGrid.addEventListener('click', (e) => {
                const favoriteButton = e.target.closest('.favorite-button');
                if (favoriteButton) {
                    const templateId = favoriteButton.dataset.templateId;
                    const template = templates.find(t => t.id === templateId);
                    if (template) {
                        template.isFavorite = !template.isFavorite;
                        saveFavorites();
                        filterAndRenderTemplates(); // Re-render to update the button state and filter
                    }
                    return; // Prevent triggering the 'Open Editor' logic
                }

  // BUY
  const buyBtn = e.target.closest('button[data-action="buy"]');
  if (buyBtn) {
    const tid = buyBtn.dataset.templateId;
    window.location.href = `payment.html?open=${encodeURIComponent(tid)}`;
    return;
  }

  // OPEN EDITOR
  const openEditorButton = e.target.closest('button[data-url]');
  if (openEditorButton && openEditorButton.dataset.url) {
    const { url, title } = openEditorButton.dataset;
    if (url && url !== blankPageUrl) {
      showEditor(url, title);
    }
  }
});

            homeBreadcrumbLink.addEventListener('click', openConfirmationModal);
            confirmBackBtn.addEventListener('click', showTemplateSelector);
            cancelBtn.addEventListener('click', closeConfirmationModal);

            window.addEventListener('click', (event) => {
                if (event.target === confirmationModal) {
                    closeConfirmationModal();
                }
            });

            // Search functionality
            searchInput.addEventListener('input', (e) => {
                currentSearchQuery = e.target.value;
                if (currentSearchQuery.length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
                filterAndRenderTemplates();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                currentSearchQuery = '';
                clearSearchBtn.classList.add('hidden');
                filterAndRenderTemplates();
            });

// Tab functionality
tabButtons.forEach(button => {
  button.addEventListener('click', () => {
    currentCategory = button.dataset.category;

    // persist the last chosen category
    localStorage.setItem('lastCategory', currentCategory);

    updateActiveTab();
    filterAndRenderTemplates();
  });
});


// --- Initial Load ---
loadFavorites();

// restore last selected category (default: 'all')
const savedCategory = localStorage.getItem('lastCategory');
currentCategory = savedCategory || 'all';

updateActiveTab();
filterAndRenderTemplates();
          
              }); // 👈 close onAuthStateChanged
}); // 👈 close DOMContentLoaded


    window.addEventListener("message", (event) => {
  // Optional origin check
  // if (event.origin !== "https://sachethan.github.io") return;

  // Forward any showMessage events to the parent (index.html)
  if (event.data?.type === "showMessage") {
    window.parent.postMessage(event.data, "*");
  }
});
