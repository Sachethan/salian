<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Chess Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #2e1065, #0f172a, #000000);
            color: #f8fafc;
            touch-action: manipulation;
            min-height: 100vh;
        }

        /* Glassmorphism UI */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(147, 51, 234, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Board Wrapper ensures overlay fits perfectly */
        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        .board-container {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .board-flipped { transform: rotate(180deg); }
        .board-flipped .chess-piece { transform: rotate(180deg); }
        .board-flipped .coord { transform: rotate(180deg); }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        /* Purple & White Board Colors */
        .square.light { background-color: #f8fafc; } /* Off-White */
        .square.dark { background-color: #9333ea; }  /* Vibrant Purple */

        .square.selected::after {
            content: ''; position: absolute; inset: 0; background-color: rgba(236, 72, 153, 0.6); /* Pink highlight */
        }

        .square.highlight-move::after {
            content: ''; position: absolute; width: 25%; height: 25%; border-radius: 50%; background-color: rgba(0, 0, 0, 0.4);
        }
        
        .square.highlight-capture::after {
            content: ''; position: absolute; inset: 0; border: 4px solid rgba(239, 68, 68, 0.8); border-radius: 50%; background-color: transparent;
        }

        .square.in-check { background-color: rgba(239, 68, 68, 0.9) !important; }

        .chess-piece {
            font-size: 2.2rem; z-index: 10; user-select: none; transition: transform 0.15s ease-in-out;
        }

        .board-flipped .chess-piece:active { transform: scale(1.15) rotate(180deg); }
        body:not(.board-flipped) .chess-piece:active { transform: scale(1.15); }

        .piece-w { color: #ffffff; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }
        .piece-b { color: #000000; filter: drop-shadow(0 2px 4px rgba(255,255,255,0.4)); }
        .piece-inactive { opacity: 0.6; transition: opacity 0.3s ease; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2)); }

        @media (min-width: 480px) { .chess-piece { font-size: 2.8rem; } }

        .coord { position: absolute; font-size: 0.65rem; font-weight: 700; padding: 3px; opacity: 0.8; }
        .coord-rank { top: 0; left: 3px; }
        .coord-file { bottom: 0; right: 3px; }
        
        .light .coord { color: #7e22ce; }
        .dark .coord { color: #f8fafc; }

        .turn-signal {
            width: 10px; height: 10px; border-radius: 50%; display: inline-block; transition: all 0.3s ease; opacity: 0.3;
        }
        .turn-signal.active-w { opacity: 1; background-color: #ffffff; box-shadow: 0 0 12px rgba(255, 255, 255, 0.8); }
        .turn-signal.active-b { opacity: 1; background-color: #9333ea; box-shadow: 0 0 12px rgba(147, 51, 234, 0.8); border: 1px solid #d8b4fe; }
        
        .player-info { display: flex; align-items: center; gap: 10px; padding: 12px 4px; font-weight: 600; color: #e2e8f0; font-size: 0.95rem; }

        #qrcode img { margin: 0 auto; border: 6px solid white; border-radius: 8px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg relative z-10">
        <!-- Header -->
        <div class="mb-2 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 mb-1 drop-shadow-sm">Master Chess Multiplayer</h1>
            
            <div id="status-badge" class="h-8 flex items-center justify-center text-sm font-medium tracking-wide">
                <span class="text-slate-400/80">Connecting network...</span>
            </div>
        </div>

        <div class="player-info justify-between">
            <div class="flex items-center gap-3">
                <div id="signal-b" class="turn-signal"></div>
                <span>Opponent</span>
            </div>
        </div>

        <!-- The Chess Board & Overlay -->
        <div class="board-wrapper my-1">
            <!-- The Board -->
            <div id="board" class="board-container"></div>
            
            <!-- Connection Setup Overlay -->
            <div id="network-panel" class="absolute inset-0 z-20 glass-panel rounded-xl flex flex-col items-center justify-center p-6 transition-all duration-700 ease-in-out">
                <div id="lobby-state" class="flex flex-col items-center gap-4 text-center w-full">
                    <div class="w-16 h-16 rounded-full bg-purple-600/20 flex items-center justify-center mb-2">
                        <i class="fas fa-network-wired text-2xl text-purple-400"></i>
                    </div>
                    <p class="text-slate-200 font-semibold text-lg">Start a Match</p>
                    <div class="flex flex-col gap-3 w-full max-w-xs">
                        <button onclick="hostGame()" class="w-full py-3 bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-purple-500 hover:to-fuchsia-500 rounded-xl text-white font-bold transition-all shadow-[0_0_15px_rgba(147,51,234,0.4)]">Host Game</button>
                        
                        <div class="flex flex-col gap-2 mt-2">
                            <button onclick="document.getElementById('join-id-container').classList.toggle('hidden')" class="w-full py-2 bg-slate-800/80 hover:bg-slate-700 border border-slate-600 rounded-xl text-white font-medium transition-all text-sm">Join with Code</button>
                            <div id="join-id-container" class="hidden flex gap-2 w-full">
                                <input type="text" id="join-id" placeholder="Enter ID..." class="flex-1 px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-purple-500 text-sm transition-colors">
                                <button onclick="joinGame()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-white font-bold transition-all text-sm">Join</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="player-info justify-between">
            <div class="flex items-center gap-3">
                <div id="signal-w" class="turn-signal active-w"></div>
                <span>You</span>
            </div>
        </div>

        <!-- Modern Controls -->
        <div class="flex justify-center mt-4 glass-panel p-3 rounded-2xl gap-3 max-w-xs mx-auto">
            <button onclick="requestUndo()" class="flex-1 py-2 flex justify-center items-center gap-2 rounded-xl bg-slate-800/60 hover:bg-slate-700 border border-slate-700 transition-all text-slate-200 font-medium text-sm">
                <i class="fas fa-undo opacity-70"></i> Undo
            </button>
            <button onclick="requestReset()" class="flex-1 py-2 flex justify-center items-center gap-2 rounded-xl bg-slate-800/60 hover:bg-slate-700 border border-slate-700 transition-all text-slate-200 font-medium text-sm">
                <i class="fas fa-redo opacity-70"></i> Restart
            </button>
        </div>

        <!-- Promotion Modal -->
        <div id="promotion-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50">
            <div class="glass-panel p-8 rounded-2xl text-center border border-purple-500/50 shadow-2xl">
                <h3 class="text-xl font-bold mb-6 text-slate-100">Promote Pawn</h3>
                <div class="flex gap-4 justify-center" id="promotion-options"></div>
            </div>
        </div>
    </div>

    <script>
        // --- WebRTC Multiplayer Logic ---
        let peer = null;
        let connection = null;
        let myColor = null; 
        let isConnected = false;

        // Warn user before accidental reload if game is active
        window.addEventListener('beforeunload', function (e) {
            if (isConnected) {
                e.preventDefault();
                e.returnValue = 'You are currently in a game. Reloading will disconnect you.';
            }
        });

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const joinId = urlParams.get('join');
            const hostRoomId = urlParams.get('room'); 

            if (joinId) {
                showLoading("Negotiating secure connection...");
                joinGame(joinId);
            } else if (hostRoomId) {
                hostGame(hostRoomId);
            } else {
                // Update status badge when waiting in lobby
                document.getElementById('status-badge').innerHTML = `<span class="text-slate-400">Waiting for players to connect...</span>`;
            }
        };

        function showLoading(text) {
            document.getElementById('lobby-state').innerHTML = `
                <div class="flex flex-col items-center">
                    <div class="w-10 h-10 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_15px_rgba(147,51,234,0.5)]"></div>
                    <p class="text-slate-200 font-semibold text-center">${text}</p>
                    <p class="text-xs text-slate-400 mt-2 text-center">This can take up to 10 seconds.</p>
                </div>
            `;
        }

        function hostGame(forceId = null) {
            const btn = document.querySelector('button[onclick="hostGame()"]');
            if(btn) {
                btn.innerText = "Creating...";
                btn.disabled = true;
            }

            peer = forceId ? new Peer(forceId, { debug: 2 }) : new Peer({ debug: 2 }); 
            
            peer.on('open', (id) => {
                let baseUrl = window.location.origin + window.location.pathname;
                
                window.history.replaceState({}, document.title, `${baseUrl}?room=${id}`);
                const joinUrl = `${baseUrl}?join=${id}`;

                document.getElementById('lobby-state').innerHTML = `
                    <div class="flex flex-col items-center w-full">
                        <p class="text-slate-100 font-bold mb-3 text-lg">Scan to Join</p>
                        <div id="qrcode" class="p-2 bg-white rounded-xl shadow-[0_0_20px_rgba(147,51,234,0.3)] mb-4"></div>
                        <div class="flex items-center gap-2 w-full max-w-[240px]">
                            <input type="text" readonly value="${joinUrl}" class="flex-1 px-3 py-2 bg-slate-900/60 border border-slate-700 rounded-lg text-xs text-slate-300 focus:outline-none">
                            <button onclick="copyToClipboard('${joinUrl}')" id="copy-btn" class="px-3 py-2 bg-purple-600 hover:bg-purple-500 rounded-lg text-white font-medium transition-colors shadow-lg text-sm">
                                Copy
                            </button>
                        </div>
                        <p class="text-xs text-purple-300 mt-4 animate-pulse font-medium"><i class="fas fa-satellite-dish mr-1"></i> Waiting for opponent...</p>
                    </div>
                `;

                new QRCode(document.getElementById("qrcode"), {
                    text: joinUrl,
                    width: 140,
                    height: 140,
                    colorDark : "#0f172a",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.L
                });
            });

            peer.on('connection', (conn) => {
                connection = conn;
                myColor = 'w'; 
                setupConnectionHandlers();
            });
            
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    window.history.replaceState({}, document.title, window.location.pathname);
                    hostGame(); 
                } else {
                    alert("Network error occurred: " + err.type);
                }
            });
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerHTML = `Copied!`;
                btn.classList.replace('bg-purple-600', 'bg-emerald-600');
                btn.classList.replace('hover:bg-purple-500', 'hover:bg-emerald-500');
                setTimeout(() => {
                    btn.innerHTML = `Copy`;
                    btn.classList.replace('bg-emerald-600', 'bg-purple-600');
                    btn.classList.replace('hover:bg-emerald-500', 'hover:bg-purple-500');
                }, 2000);
            });
        }

        function joinGame(autoJoinId = null) {
            const joinId = autoJoinId || document.getElementById('join-id').value.trim();
            if (!joinId) return alert("Please enter a Host ID!");

            if (!autoJoinId) showLoading("Connecting to host...");

            peer = new Peer({ debug: 2 });
            
            peer.on('open', () => {
                connection = peer.connect(joinId, { reliable: true });
                myColor = 'b'; 
                setupConnectionHandlers();
            });
            
            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    alert("Host is unreachable. They may have closed the room.");
                } else {
                    alert("Network error: Could not connect to host.");
                }
                window.location.search = ''; 
            });
        }

        function setupConnectionHandlers() {
            connection.on('open', () => {
                isConnected = true;
                
                if (myColor === 'b') {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }

                // Super smooth disappear effect
                const networkPanel = document.getElementById('network-panel');
                networkPanel.classList.add('opacity-0', 'scale-110', 'pointer-events-none');
                
                if (myColor === 'b') {
                    document.getElementById('board').classList.add('board-flipped');
                }

                resetGame(true); 
                updateStatus();
                
                // Show secure connection toast in header
                document.getElementById('status-badge').innerHTML = `
                    <div class="flex items-center gap-2 px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-full">
                        <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></div>
                        <span class="text-emerald-400 font-bold text-xs tracking-wide">MATCH SECURED</span>
                    </div>
                `;
            });

            connection.on('data', (data) => {
                if (data.type === 'move') {
                    makeMove(data.move, true);
                } else if (data.type === 'reset') {
                    resetGame(true);
                } else if (data.type === 'undo') {
                    undoMove(true);
                }
            });

            connection.on('close', () => {
                isConnected = false;
                alert("Opponent disconnected!");
                window.location.search = ''; 
                location.reload(); 
            });
        }

        // --- Initialize Game Logic (using chess.js) ---
        const game = new Chess();
        const boardEl = document.getElementById('board');
        const statusBadge = document.getElementById('status-badge');
        const promotionModal = document.getElementById('promotion-modal');
        const promotionOptions = document.getElementById('promotion-options');
        
        let selectedSquare = null;
        let legalMoves = [];
        let pendingMove = null;

        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
        
        const iconMap = {
            'p': 'fa-chess-pawn', 'n': 'fa-chess-knight', 'b': 'fa-chess-bishop',
            'r': 'fa-chess-rook', 'q': 'fa-chess-queen', 'k': 'fa-chess-king'
        };

        function initBoard() {
            boardEl.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const squareObj = document.createElement('div');
                    const file = files[j];
                    const rank = ranks[i];
                    const squareId = file + rank;
                    
                    squareObj.className = `square ${(i + j) % 2 === 0 ? 'light' : 'dark'}`;
                    squareObj.id = squareId;
                    squareObj.dataset.square = squareId;
                    
                    if (j === 0) {
                        const rankLabel = document.createElement('span');
                        rankLabel.className = 'coord coord-rank';
                        rankLabel.innerText = rank;
                        squareObj.appendChild(rankLabel);
                    }
                    if (i === 7) {
                        const fileLabel = document.createElement('span');
                        fileLabel.className = 'coord coord-file';
                        fileLabel.innerText = file;
                        squareObj.appendChild(fileLabel);
                    }

                    squareObj.addEventListener('click', () => handleSquareClick(squareId));
                    boardEl.appendChild(squareObj);
                }
            }
            updateBoardVisuals();
        }

        function updateBoardVisuals() {
            document.querySelectorAll('.square').forEach(sq => {
                const pieces = sq.querySelectorAll('.chess-piece');
                pieces.forEach(p => p.remove());
                sq.classList.remove('selected', 'highlight-move', 'highlight-capture', 'in-check');
            });

            const boardState = game.board();
            const currentTurn = game.turn();

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = boardState[i][j];
                    if (piece) {
                        const squareId = files[j] + ranks[i];
                        const squareEl = document.getElementById(squareId);
                        
                        const pieceEl = document.createElement('i');
                        pieceEl.className = `fa-solid ${iconMap[piece.type]} chess-piece piece-${piece.color}`;
                        
                        if (piece.color !== currentTurn || (isConnected && piece.color !== myColor)) {
                            pieceEl.classList.add('piece-inactive');
                        }

                        squareEl.appendChild(pieceEl);

                        if (piece.type === 'k' && piece.color === currentTurn && game.in_check()) {
                            squareEl.classList.add('in-check');
                        }
                    }
                }
            }

            if (selectedSquare) {
                document.getElementById(selectedSquare).classList.add('selected');
                legalMoves.forEach(move => {
                    const targetSquareEl = document.getElementById(move.to);
                    if (move.flags.includes('c') || move.flags.includes('e')) {
                        targetSquareEl.classList.add('highlight-capture');
                    } else {
                        targetSquareEl.classList.add('highlight-move');
                    }
                });
            }

            if (isConnected) updateStatus();
        }

        function handleSquareClick(squareId) {
            if (game.game_over() || !isConnected) return;
            if (game.turn() !== myColor) return;

            if (selectedSquare) {
                const move = legalMoves.find(m => m.to === squareId);
                
                if (move) {
                    if (move.flags.includes('p') || move.flags.includes('cp')) {
                        pendingMove = { from: selectedSquare, to: squareId };
                        showPromotionModal(game.turn());
                        return;
                    }
                    makeMove({ from: selectedSquare, to: squareId });
                    return;
                }
            }

            const piece = game.get(squareId);
            if (piece && piece.color === game.turn()) {
                selectedSquare = squareId;
                legalMoves = game.moves({ square: squareId, verbose: true });
            } else {
                selectedSquare = null;
                legalMoves = [];
            }
            updateBoardVisuals();
        }

        function makeMove(moveObj, isRemote = false) {
            game.move(moveObj);
            selectedSquare = null;
            legalMoves = [];
            pendingMove = null;
            
            updateBoardVisuals();

            if (!isRemote && connection && connection.open) {
                connection.send({ type: 'move', move: moveObj });
            }
        }

        function showPromotionModal(color) {
            promotionOptions.innerHTML = '';
            const pieces = ['q', 'r', 'b', 'n'];
            
            pieces.forEach(p => {
                const btn = document.createElement('button');
                btn.className = `p-5 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl text-4xl transition-all shadow-lg piece-${color}`;
                if (myColor === 'b') btn.style.transform = 'rotate(180deg)';
                
                btn.innerHTML = `<i class="fa-solid ${iconMap[p]}"></i>`;
                btn.onclick = () => {
                    pendingMove.promotion = p;
                    makeMove(pendingMove);
                    promotionModal.classList.replace('flex', 'hidden');
                };
                promotionOptions.appendChild(btn);
            });
            promotionModal.classList.replace('hidden', 'flex');
        }

        function updateStatus() {
            const signalW = document.getElementById('signal-w');
            const signalB = document.getElementById('signal-b');
            
            if (game.turn() === 'w') {
                signalW.classList.add('active-w');
                signalB.classList.remove('active-b');
            } else {
                signalB.classList.add('active-b');
                signalW.classList.remove('active-w');
            }

            if (game.in_checkmate()) {
                let isMe = (game.turn() === 'w' ? 'b' : 'w') === myColor;
                document.getElementById('status-badge').innerHTML = `<span class="text-white font-bold px-4 py-1.5 rounded-full ${isMe ? 'bg-emerald-600 border-emerald-500' : 'bg-red-600 border-red-500'} border shadow-lg"><i class="fas fa-trophy mr-2"></i> Checkmate! ${isMe ? 'You Won!' : 'Opponent Won'}</span>`;
                signalW.className = 'turn-signal';
                signalB.className = 'turn-signal';
            } else if (game.in_draw()) {
                document.getElementById('status-badge').innerHTML = `<span class="text-yellow-100 font-bold px-4 py-1.5 rounded-full bg-yellow-600 border border-yellow-500 shadow-lg">Game Over - Draw</span>`;
                signalW.className = 'turn-signal';
                signalB.className = 'turn-signal';
            } else if (game.in_check()) {
                document.getElementById('status-badge').innerHTML = `<span class="text-white font-bold px-4 py-1.5 rounded-full bg-red-600 border border-red-500 shadow-[0_0_15px_rgba(220,38,38,0.6)] animate-pulse"><i class="fas fa-exclamation-triangle mr-1"></i> King in Check!</span>`;
            } else {
                // Return to normal match secured badge
                document.getElementById('status-badge').innerHTML = `
                    <div class="flex items-center gap-2 px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-full">
                        <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></div>
                        <span class="text-emerald-400 font-bold text-xs tracking-wide">MATCH SECURED</span>
                    </div>
                `;
            }
        }

        function requestReset() {
            if (!isConnected) return;
            resetGame();
            if (connection && connection.open) {
                connection.send({ type: 'reset' });
            }
        }

        function resetGame(isRemote = false) {
            game.reset();
            selectedSquare = null;
            legalMoves = [];
            updateBoardVisuals();
        }

        function requestUndo() {
            if (!isConnected) return;
            undoMove();
            undoMove();
            if (connection && connection.open) {
                connection.send({ type: 'undo' });
            }
        }

        function undoMove(isRemote = false) {
            game.undo();
            if (isRemote) game.undo(); 
            selectedSquare = null;
            legalMoves = [];
            updateBoardVisuals();
        }

        initBoard();
    </script>
</body>
</html>
