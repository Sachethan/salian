<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P QR Chat</title>
    <!-- Import PeerJS for background connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Import QR Code generator library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --primary: #4a90e2;
            --bg-grad: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-grad);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .app-container {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 900px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: white;
            padding: 16px 24px;
            font-size: 1.2rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Setup & Share Screen */
        .setup-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        .share-panel {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .qr-container {
            background: white;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #eee;
            /* qrcode.js will render the canvas here */
        }

        .link-group {
            width: 100%;
            display: flex;
            gap: 8px;
        }

        .link-group input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f9fa;
            font-family: monospace;
            font-size: 0.9rem;
            outline: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        button:hover { filter: brightness(1.1); }
        button.success { background: #28a745; }

        /* Chat Interface */
        .chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg-self { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-other { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #eee; }
        .msg-system { background: rgba(0,0,0,0.05); color: #666; align-self: center; font-size: 0.85rem; border-radius: 20px; padding: 6px 12px; }

        .input-area {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid rgba(0,0,0,0.05);
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid #ddd;
            border-radius: 24px;
            outline: none;
            font-size: 1rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header" id="header-title">Connecting...</div>

        <!-- Setup / Share Screen -->
        <div id="setup-screen" class="setup-screen">
            <h2 id="status-text" style="margin-bottom: 20px;">Initializing Network...</h2>
            
            <div id="share-panel" class="share-panel hidden">
                <p>Have your friend scan this QR code or send them the link below to connect securely.</p>
                
                <div id="qrcode" class="qr-container"></div>
                
                <div class="link-group">
                    <input type="text" id="invite-link" readonly>
                    <button id="copy-btn" onclick="copyLink()">Copy Link</button>
                </div>
                
                <p style="font-size: 0.85rem; color: #888;">Waiting for them to join...</p>
            </div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="chat-screen">
            <div class="messages" id="messages-container"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let chatConnection = null;

        function init() {
            peer = new Peer();

            peer.on('open', (id) => {
                const hash = window.location.hash;
                
                if (hash.startsWith('#room=')) {
                    // We are User B (Guest joining via link/QR)
                    document.getElementById('status-text').textContent = "Joining Room...";
                    const hostId = hash.replace('#room=', '');
                    chatConnection = peer.connect(hostId);
                    setupChatEvents(chatConnection);
                } else {
                    // We are User A (Host creating the room)
                    document.getElementById('status-text').textContent = "Room Ready to Share";
                    const link = `${window.location.origin}${window.location.pathname}#room=${id}`;
                    
                    // 1. Populate the text input
                    document.getElementById('invite-link').value = link;
                    
                    // 2. Generate the QR Code using the library
                    new QRCode(document.getElementById("qrcode"), {
                        text: link,
                        width: 180,
                        height: 180,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });

                    document.getElementById('share-panel').classList.remove('hidden');
                    document.getElementById('header-title').textContent = "Share Room";
                }
            });

            peer.on('connection', (connection) => {
                chatConnection = connection;
                setupChatEvents(chatConnection);
            });
        }

        // Copy to Clipboard feature
        function copyLink() {
            const linkInput = document.getElementById('invite-link');
            linkInput.select();
            document.execCommand("copy");
            
            const btn = document.getElementById('copy-btn');
            btn.textContent = "Copied!";
            btn.classList.add('success');
            
            setTimeout(() => {
                btn.textContent = "Copy Link";
                btn.classList.remove('success');
            }, 2000);
        }

        // Handle the active chat session
        function setupChatEvents(conn) {
            conn.on('open', () => {
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('chat-screen').style.display = 'flex';
                document.getElementById('header-title').textContent = "Secure P2P Chat";
                appendMessage("Connection established. Traffic is peer-to-peer.", "msg-system");
            });

            conn.on('data', (data) => appendMessage(data, 'msg-other'));
            conn.on('close', () => appendMessage("The other user disconnected.", "msg-system"));
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            
            if (text && chatConnection && chatConnection.open) {
                chatConnection.send(text);
                appendMessage(text, 'msg-self');
                input.value = '';
            }
        }

        function appendMessage(text, className) {
            const container = document.getElementById('messages-container');
            const el = document.createElement('div');
            el.className = `message ${className}`;
            el.textContent = text;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }

        init();
    </script>
</body>
</html>
