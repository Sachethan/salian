<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplayer Classic Chess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Chess.js for robust game logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- PeerJS for WebRTC Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            touch-action: manipulation;
        }

        h1 {
            font-family: 'Playfair Display', serif;
        }

        .board-container {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border: 8px solid #1e293b;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            overflow: hidden;
            transition: transform 0.5s ease;
        }

        /* Flipping the board for the Black player */
        .board-flipped {
            transform: rotate(180deg);
        }
        .board-flipped .chess-piece {
            transform: rotate(180deg);
        }
        .board-flipped .coord {
            transform: rotate(180deg);
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        /* Classic Chess Board Colors */
        .square.light { background-color: #f0d9b5; }
        .square.dark { background-color: #b58863; }

        /* Highlights */
        .square.selected::after {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(255, 255, 51, 0.5);
        }

        .square.highlight-move::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.2);
        }
        
        .square.highlight-capture::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 4px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            background-color: transparent;
        }

        .square.in-check {
            background-color: #ef4444 !important; /* Red 500 */
        }

        /* Piece Styling */
        .chess-piece {
            font-size: 2rem;
            z-index: 10;
            user-select: none;
            transition: transform 0.1s ease-in-out;
        }

        /* Combined active scaling and flipped board piece orientation */
        .board-flipped .chess-piece:active { transform: scale(1.1) rotate(180deg); }
        body:not(.board-flipped) .chess-piece:active { transform: scale(1.1); }

        .piece-w {
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4), 0 0 1px #000;
        }

        .piece-b {
            color: #111827;
            text-shadow: 0 1px 2px rgba(255,255,255,0.4);
        }

        /* Opacity for non-playing side */
        .piece-inactive {
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        @media (min-width: 480px) {
            .chess-piece { font-size: 2.5rem; }
        }

        /* Coordinates */
        .coord {
            position: absolute;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 2px;
            opacity: 0.7;
        }
        .coord-rank { top: 0; left: 2px; }
        .coord-file { bottom: 0; right: 2px; }
        
        .light .coord { color: #b58863; }
        .dark .coord { color: #f0d9b5; }

        /* Turn Signal Indicators */
        .turn-signal {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
            opacity: 0.2;
            box-shadow: 0 0 0 rgba(0,0,0,0);
        }

        .turn-signal.active-w {
            opacity: 1;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            border: 1px solid #94a3b8;
        }

        .turn-signal.active-b {
            opacity: 1;
            background-color: #000000;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            border: 1px solid #334155;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            font-weight: 500;
            color: #cbd5e1;
        }

        /* Multiplayer Network Panel */
        #network-panel {
            background-color: #1e293b;
            border: 1px solid #334155;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg">
        <!-- Header & Status -->
        <div class="mb-2 text-center">
            <h1 class="text-4xl font-bold mb-1 text-yellow-400">Grandmaster</h1>
            
            <!-- Multiplayer Lobby UI -->
            <div id="network-panel" class="rounded-lg p-3 mb-3 text-sm shadow-md">
                <div id="lobby-state" class="flex flex-col items-center gap-3">
                    <p class="text-slate-300 font-semibold">WebRTC Multiplayer</p>
                    <div class="flex gap-2 w-full justify-center">
                        <button onclick="hostGame()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-white font-medium transition-colors">Host Game</button>
                        <span class="flex items-center text-slate-400">or</span>
                        <input type="text" id="join-id" placeholder="Enter Host ID" class="px-3 py-2 bg-slate-900 border border-slate-600 rounded text-white w-32 focus:outline-none focus:border-blue-400">
                        <button onclick="joinGame()" class="px-4 py-2 bg-green-600 hover:bg-green-500 rounded text-white font-medium transition-colors">Join</button>
                    </div>
                </div>
                
                <div id="connected-state" class="hidden flex flex-col items-center gap-2">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                        <span class="text-green-400 font-medium">Connected to opponent</span>
                    </div>
                    <div id="player-role" class="text-slate-300 text-xs uppercase tracking-widest font-bold"></div>
                </div>
            </div>

            <div id="status-badge" class="h-8 flex items-center justify-center text-sm font-medium tracking-wide">
                <span class="text-slate-400">Waiting for players to connect...</span>
            </div>
        </div>

        <!-- Black Player Info (Top) -->
        <div class="player-info justify-between">
            <div class="flex items-center gap-2">
                <div id="signal-b" class="turn-signal"></div>
                <span>Black</span>
            </div>
            <div id="captured-b" class="text-xl tracking-tight text-slate-400 flex flex-wrap gap-1"></div>
        </div>

        <!-- The Chess Board -->
        <div id="board" class="board-container my-2">
            <!-- Squares generated via JS -->
        </div>

        <!-- White Player Info (Bottom) -->
        <div class="player-info justify-between">
            <div class="flex items-center gap-2">
                <div id="signal-w" class="turn-signal active-w"></div>
                <span>White</span>
            </div>
             <div id="captured-w" class="text-xl tracking-tight text-slate-400 flex flex-wrap gap-1"></div>
        </div>

        <!-- Controls -->
        <div class="flex justify-center mt-6 items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <div class="flex gap-4">
                <button onclick="requestUndo()" class="px-4 py-2 flex items-center gap-2 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors text-slate-200 font-medium" title="Undo Move">
                    <i class="fas fa-undo"></i> Undo
                </button>
                <button onclick="requestReset()" class="px-4 py-2 flex items-center gap-2 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors text-slate-200 font-medium" title="New Game">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>
        </div>

        <!-- Promotion Modal -->
        <div id="promotion-modal" class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center z-50">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-600 text-center">
                <h3 class="text-lg font-medium mb-4">Promote Pawn</h3>
                <div class="flex gap-4 justify-center" id="promotion-options">
                    <!-- Buttons added dynamically based on color -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- WebRTC Multiplayer Logic (PeerJS) ---
        let peer = null;
        let connection = null;
        let myColor = null; // 'w' or 'b'
        let isConnected = false;

        function hostGame() {
            const btn = document.querySelector('button[onclick="hostGame()"]');
            btn.innerText = "Creating...";
            btn.disabled = true;

            peer = new Peer(); // Generates random ID
            
            peer.on('open', (id) => {
                document.getElementById('lobby-state').innerHTML = `
                    <p class="text-slate-300">Share this ID with your friend:</p>
                    <div class="bg-slate-900 px-4 py-2 rounded text-blue-400 font-mono text-lg font-bold tracking-wider select-all cursor-pointer border border-blue-900">${id}</div>
                    <p class="text-xs text-slate-500 mt-2">Waiting for opponent to join...</p>
                `;
            });

            peer.on('connection', (conn) => {
                connection = conn;
                myColor = 'w'; // Host plays white
                setupConnectionHandlers();
            });
        }

        function joinGame() {
            const joinId = document.getElementById('join-id').value.trim();
            if (!joinId) return alert("Please enter a Host ID!");

            peer = new Peer();
            peer.on('open', () => {
                connection = peer.connect(joinId);
                myColor = 'b'; // Joiner plays black
                setupConnectionHandlers();
            });
        }

        function setupConnectionHandlers() {
            connection.on('open', () => {
                isConnected = true;
                
                // Update UI
                document.getElementById('lobby-state').classList.add('hidden');
                document.getElementById('connected-state').classList.remove('hidden');
                document.getElementById('player-role').innerText = `You are playing as ${myColor === 'w' ? 'WHITE' : 'BLACK'}`;
                
                // Flip board if player is black
                if (myColor === 'b') {
                    document.getElementById('board').classList.add('board-flipped');
                }

                resetGame(true); // Ensure clean board
                updateStatus();
            });

            connection.on('data', (data) => {
                if (data.type === 'move') {
                    makeMove(data.move, true);
                } else if (data.type === 'reset') {
                    resetGame(true);
                } else if (data.type === 'undo') {
                    undoMove(true);
                }
            });

            connection.on('close', () => {
                alert("Opponent disconnected!");
                location.reload(); // Quick reset
            });
        }


        // --- Initialize Game Logic (using chess.js) ---
        const game = new Chess();
        
        // DOM Elements
        const boardEl = document.getElementById('board');
        const statusBadge = document.getElementById('status-badge');
        const promotionModal = document.getElementById('promotion-modal');
        const promotionOptions = document.getElementById('promotion-options');
        
        // State
        let selectedSquare = null;
        let legalMoves = [];
        let pendingMove = null;

        // Constants
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
        
        const iconMap = {
            'p': 'fa-chess-pawn',
            'n': 'fa-chess-knight',
            'b': 'fa-chess-bishop',
            'r': 'fa-chess-rook',
            'q': 'fa-chess-queen',
            'k': 'fa-chess-king'
        };

        function initBoard() {
            boardEl.innerHTML = '';
            
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const squareObj = document.createElement('div');
                    const file = files[j];
                    const rank = ranks[i];
                    const squareId = file + rank;
                    
                    squareObj.className = `square ${(i + j) % 2 === 0 ? 'light' : 'dark'}`;
                    squareObj.id = squareId;
                    squareObj.dataset.square = squareId;
                    
                    // Coordinates (only on edges)
                    if (j === 0) {
                        const rankLabel = document.createElement('span');
                        rankLabel.className = 'coord coord-rank';
                        rankLabel.innerText = rank;
                        squareObj.appendChild(rankLabel);
                    }
                    if (i === 7) {
                        const fileLabel = document.createElement('span');
                        fileLabel.className = 'coord coord-file';
                        fileLabel.innerText = file;
                        squareObj.appendChild(fileLabel);
                    }

                    // Click event handler
                    squareObj.addEventListener('click', () => handleSquareClick(squareId));
                    
                    boardEl.appendChild(squareObj);
                }
            }
            updateBoardVisuals();
        }

        function updateBoardVisuals() {
            // Clear current pieces and highlights
            document.querySelectorAll('.square').forEach(sq => {
                const pieces = sq.querySelectorAll('.chess-piece');
                pieces.forEach(p => p.remove());
                sq.classList.remove('selected', 'highlight-move', 'highlight-capture', 'in-check');
            });

            // Get current board state
            const boardState = game.board();
            const currentTurn = game.turn();

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = boardState[i][j];
                    if (piece) {
                        const squareId = files[j] + ranks[i];
                        const squareEl = document.getElementById(squareId);
                        
                        const pieceEl = document.createElement('i');
                        pieceEl.className = `fa-solid ${iconMap[piece.type]} chess-piece piece-${piece.color}`;
                        
                        // Apply opacity if it's not this piece's turn OR not the player's piece
                        if (piece.color !== currentTurn || (isConnected && piece.color !== myColor)) {
                            pieceEl.classList.add('piece-inactive');
                        }

                        squareEl.appendChild(pieceEl);

                        // Highlight King in check
                        if (piece.type === 'k' && piece.color === currentTurn && game.in_check()) {
                            squareEl.classList.add('in-check');
                        }
                    }
                }
            }

            // Apply Highlights
            if (selectedSquare) {
                document.getElementById(selectedSquare).classList.add('selected');
                
                legalMoves.forEach(move => {
                    const targetSquareEl = document.getElementById(move.to);
                    if (move.flags.includes('c') || move.flags.includes('e')) {
                        targetSquareEl.classList.add('highlight-capture');
                    } else {
                        targetSquareEl.classList.add('highlight-move');
                    }
                });
            }

            if (isConnected) updateStatus();
        }

        function handleSquareClick(squareId) {
            if (game.game_over() || !isConnected) return;
            
            // SECURITY/MULTIPLAYER: Only allow moving your own pieces on your turn
            if (game.turn() !== myColor) return;

            // If a piece is already selected, check if clicked square is a valid move destination
            if (selectedSquare) {
                const move = legalMoves.find(m => m.to === squareId);
                
                if (move) {
                    // Check for promotion
                    if (move.flags.includes('p') || move.flags.includes('cp')) {
                        pendingMove = { from: selectedSquare, to: squareId };
                        showPromotionModal(game.turn());
                        return;
                    }
                    
                    makeMove({ from: selectedSquare, to: squareId });
                    return;
                }
            }

            // Select a piece
            const piece = game.get(squareId);
            if (piece && piece.color === game.turn()) {
                selectedSquare = squareId;
                legalMoves = game.moves({ square: squareId, verbose: true });
            } else {
                selectedSquare = null;
                legalMoves = [];
            }
            
            updateBoardVisuals();
        }

        // isRemote determines if the move came from the network or local user
        function makeMove(moveObj, isRemote = false) {
            game.move(moveObj);
            selectedSquare = null;
            legalMoves = [];
            pendingMove = null;
            
            updateBoardVisuals();

            // Send move to opponent if we made it locally
            if (!isRemote && connection && connection.open) {
                connection.send({ type: 'move', move: moveObj });
            }
        }

        // --- Promotion Logic ---
        function showPromotionModal(color) {
            promotionOptions.innerHTML = '';
            const pieces = ['q', 'r', 'b', 'n'];
            
            pieces.forEach(p => {
                const btn = document.createElement('button');
                btn.className = `p-4 bg-slate-700 hover:bg-slate-600 rounded-lg text-3xl transition-colors piece-${color}`;
                // Apply reverse rotation if board is flipped so options don't look upside down to black
                if (myColor === 'b') btn.style.transform = 'rotate(180deg)';
                
                btn.innerHTML = `<i class="fa-solid ${iconMap[p]}"></i>`;
                btn.onclick = () => {
                    pendingMove.promotion = p;
                    makeMove(pendingMove);
                    promotionModal.classList.replace('flex', 'hidden');
                };
                promotionOptions.appendChild(btn);
            });
            
            promotionModal.classList.replace('hidden', 'flex');
        }

        // --- Game Status & Controls ---
        function updateStatus() {
            const statusBadge = document.getElementById('status-badge');
            const signalW = document.getElementById('signal-w');
            const signalB = document.getElementById('signal-b');
            
            let statusHTML = '';
            
            if (game.turn() === 'w') {
                signalW.classList.add('active-w');
                signalB.classList.remove('active-b');
            } else {
                signalB.classList.add('active-b');
                signalW.classList.remove('active-w');
            }

            if (game.in_checkmate()) {
                let winner = game.turn() === 'w' ? 'Black' : 'White';
                let winnerColor = game.turn() === 'w' ? 'b' : 'w';
                let isMe = winnerColor === myColor;
                
                statusHTML = `<span class="text-${isMe?'green':'red'}-400 font-bold px-4 py-1 rounded-full bg-slate-800 border border-${isMe?'green':'red'}-500"><i class="fas fa-trophy mr-1"></i> Checkmate! ${isMe ? 'You Win!' : 'Opponent Wins'}</span>`;
                signalW.className = 'turn-signal';
                signalB.className = 'turn-signal';
            } else if (game.in_draw()) {
                statusHTML = `<span class="text-yellow-400 font-bold px-4 py-1 rounded-full bg-slate-800 border border-yellow-500">Game Over - Draw!</span>`;
                signalW.className = 'turn-signal';
                signalB.className = 'turn-signal';
            } else {
                if (game.in_check()) {
                    statusHTML = `<span class="text-red-400 font-bold px-4 py-1 rounded-full bg-slate-800 border border-red-500 animate-pulse"><i class="fas fa-exclamation-triangle mr-1"></i> Check</span>`;
                } else {
                    let isMyTurn = game.turn() === myColor;
                    statusHTML = `<span class="text-slate-300 font-medium">${isMyTurn ? "Your turn" : "Opponent's turn..."}</span>`;
                }
            }

            statusBadge.innerHTML = statusHTML;
        }

        function requestReset() {
            if (!isConnected) return;
            resetGame();
            if (connection && connection.open) {
                connection.send({ type: 'reset' });
            }
        }

        function resetGame(isRemote = false) {
            game.reset();
            selectedSquare = null;
            legalMoves = [];
            updateBoardVisuals();
        }

        function requestUndo() {
            if (!isConnected) return;
            // Undo twice to revert both opponent's last move and your last move
            undoMove();
            undoMove();
            if (connection && connection.open) {
                connection.send({ type: 'undo' });
            }
        }

        function undoMove(isRemote = false) {
            game.undo();
            if (isRemote) game.undo(); // If opponent requested it, undo their move and yours
            selectedSquare = null;
            legalMoves = [];
            updateBoardVisuals();
        }

        // Start Game
        initBoard();

    </script>
</body>
</html>
