<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classic Chess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Chess.js for robust game logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            touch-action: manipulation;
        }

        h1 {
            font-family: 'Playfair Display', serif;
        }

        .board-container {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border: 8px solid #1e293b;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            overflow: hidden;
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        /* Classic Chess Board Colors */
        .square.light { background-color: #f0d9b5; }
        .square.dark { background-color: #b58863; }

        /* Highlights */
        .square.selected::after {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(255, 255, 51, 0.5);
        }

        .square.highlight-move::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.2);
        }
        
        .square.highlight-capture::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 4px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            background-color: transparent;
        }

        .square.in-check {
            background-color: #ef4444 !important; /* Red 500 */
        }

        /* Piece Styling */
        .chess-piece {
            font-size: 2rem;
            z-index: 10;
            user-select: none;
            transition: transform 0.1s ease-in-out;
        }

        .chess-piece:active {
            transform: scale(1.1);
        }

        .piece-w {
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4), 0 0 1px #000;
        }

        .piece-b {
            color: #111827;
            text-shadow: 0 1px 2px rgba(255,255,255,0.4);
        }

        /* Opacity for non-playing side */
        .piece-inactive {
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        @media (min-width: 480px) {
            .chess-piece { font-size: 2.5rem; }
        }

        /* Coordinates */
        .coord {
            position: absolute;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 2px;
            opacity: 0.7;
        }
        .coord-rank { top: 0; left: 2px; }
        .coord-file { bottom: 0; right: 2px; }
        
        .light .coord { color: #b58863; }
        .dark .coord { color: #f0d9b5; }

        /* Turn Signal Indicators */
        .turn-signal {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
            opacity: 0.2;
            box-shadow: 0 0 0 rgba(0,0,0,0);
        }

        .turn-signal.active-w {
            opacity: 1;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            border: 1px solid #94a3b8;
        }

        .turn-signal.active-b {
            opacity: 1;
            background-color: #000000;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            border: 1px solid #334155;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            font-weight: 500;
            color: #cbd5e1;
        }

        /* Opacity for non-playing side */
        .piece-inactive {
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg">
        <!-- Header & Status -->
        <div class="mb-2 text-center">
            <h1 class="text-4xl font-bold mb-2 text-yellow-400">Grandmaster</h1>
            <div id="status-badge" class="h-8 flex items-center justify-center text-sm font-medium tracking-wide">
                <!-- Check/Checkmate status will appear here -->
            </div>
        </div>

        <!-- Black Player Info (Top) -->
        <div class="player-info justify-between">
            <div class="flex items-center gap-2">
                <div id="signal-b" class="turn-signal"></div>
                <span>Black</span>
            </div>
            <div id="captured-b" class="text-xl tracking-tight text-slate-400 flex flex-wrap gap-1"></div>
        </div>

        <!-- The Chess Board -->
        <div id="board" class="board-container my-2">
            <!-- Squares generated via JS -->
        </div>

        <!-- White Player Info (Bottom) -->
        <div class="player-info justify-between">
            <div class="flex items-center gap-2">
                <div id="signal-w" class="turn-signal active-w"></div>
                <span>White</span>
            </div>
             <div id="captured-w" class="text-xl tracking-tight text-slate-400 flex flex-wrap gap-1"></div>
        </div>

        <!-- Controls -->
        <div class="flex justify-center mt-6 items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <div class="flex gap-4">
                <button onclick="undoMove()" class="px-4 py-2 flex items-center gap-2 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors text-slate-200 font-medium" title="Undo Move">
                    <i class="fas fa-undo"></i> Undo
                </button>
                <button onclick="resetGame()" class="px-4 py-2 flex items-center gap-2 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors text-slate-200 font-medium" title="New Game">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>
        </div>

        <!-- Promotion Modal -->
        <div id="promotion-modal" class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center z-50">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-600 text-center">
                <h3 class="text-lg font-medium mb-4">Promote Pawn</h3>
                <div class="flex gap-4 justify-center" id="promotion-options">
                    <!-- Buttons added dynamically based on color -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Game Logic (using chess.js)
        const game = new Chess();
        
        // DOM Elements
        const boardEl = document.getElementById('board');
        const statusBadge = document.getElementById('status-badge');
        const promotionModal = document.getElementById('promotion-modal');
        const promotionOptions = document.getElementById('promotion-options');
        
        // State
        let selectedSquare = null;
        let legalMoves = [];
        let pendingMove = null; // For promotion

        // Constants
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
        
        const iconMap = {
            'p': 'fa-chess-pawn',
            'n': 'fa-chess-knight',
            'b': 'fa-chess-bishop',
            'r': 'fa-chess-rook',
            'q': 'fa-chess-queen',
            'k': 'fa-chess-king'
        };

        // Initialize UI Board
        function initBoard() {
            boardEl.innerHTML = '';
            
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const squareObj = document.createElement('div');
                    const file = files[j];
                    const rank = ranks[i];
                    const squareId = file + rank;
                    
                    squareObj.className = `square ${(i + j) % 2 === 0 ? 'light' : 'dark'}`;
                    squareObj.id = squareId;
                    squareObj.dataset.square = squareId;
                    
                    // Coordinates (only on edges)
                    if (j === 0) {
                        const rankLabel = document.createElement('span');
                        rankLabel.className = 'coord coord-rank';
                        rankLabel.innerText = rank;
                        squareObj.appendChild(rankLabel);
                    }
                    if (i === 7) {
                        const fileLabel = document.createElement('span');
                        fileLabel.className = 'coord coord-file';
                        fileLabel.innerText = file;
                        squareObj.appendChild(fileLabel);
                    }

                    // Click event handler
                    squareObj.addEventListener('click', () => handleSquareClick(squareId));
                    
                    boardEl.appendChild(squareObj);
                }
            }
            updateBoardVisuals();
        }

        // Render pieces and highlights based on current game state
        function updateBoardVisuals() {
            // Clear current pieces and highlights
            document.querySelectorAll('.square').forEach(sq => {
                const pieces = sq.querySelectorAll('.chess-piece');
                pieces.forEach(p => p.remove());
                sq.classList.remove('selected', 'highlight-move', 'highlight-capture', 'in-check');
            });

            // Get current board state
            const boardState = game.board(); // 2D array [8][8]
            const currentTurn = game.turn();

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = boardState[i][j];
                    if (piece) {
                        const squareId = files[j] + ranks[i];
                        const squareEl = document.getElementById(squareId);
                        
                        const pieceEl = document.createElement('i');
                        pieceEl.className = `fa-solid ${iconMap[piece.type]} chess-piece piece-${piece.color}`;
                        
                        // Apply opacity if it's not this piece's turn
                        if (piece.color !== currentTurn) {
                            pieceEl.classList.add('piece-inactive');
                        }

                        squareEl.appendChild(pieceEl);

                        // Highlight King in check
                        if (piece.type === 'k' && piece.color === currentTurn && game.in_check()) {
                            squareEl.classList.add('in-check');
                        }
                    }
                }
            }

            // Apply Highlights
            if (selectedSquare) {
                document.getElementById(selectedSquare).classList.add('selected');
                
                legalMoves.forEach(move => {
                    const targetSquareEl = document.getElementById(move.to);
                    if (move.flags.includes('c') || move.flags.includes('e')) {
                        targetSquareEl.classList.add('highlight-capture');
                    } else {
                        targetSquareEl.classList.add('highlight-move');
                    }
                });
            }

            updateStatus();
        }

        // Handle user interaction
        function handleSquareClick(squareId) {
            if (game.game_over()) return;

            // If a piece is already selected, check if clicked square is a valid move destination
            if (selectedSquare) {
                const move = legalMoves.find(m => m.to === squareId);
                
                if (move) {
                    // Check for promotion
                    if (move.flags.includes('p') || move.flags.includes('cp')) {
                        pendingMove = { from: selectedSquare, to: squareId };
                        showPromotionModal(game.turn());
                        return; // Wait for modal input
                    }
                    
                    // Make normal move
                    makeMove({ from: selectedSquare, to: squareId });
                    return;
                }
            }

            // Select a piece (if it belongs to the player whose turn it is)
            const piece = game.get(squareId);
            if (piece && piece.color === game.turn()) {
                selectedSquare = squareId;
                legalMoves = game.moves({ square: squareId, verbose: true });
            } else {
                // Clicked empty space or enemy piece without having a valid piece selected
                selectedSquare = null;
                legalMoves = [];
            }
            
            updateBoardVisuals();
        }

        function makeMove(moveObj) {
            game.move(moveObj);
            selectedSquare = null;
            legalMoves = [];
            pendingMove = null;
            updateBoardVisuals();
        }

        // --- Promotion Logic ---
        function showPromotionModal(color) {
            promotionOptions.innerHTML = '';
            const pieces = ['q', 'r', 'b', 'n'];
            
            pieces.forEach(p => {
                const btn = document.createElement('button');
                btn.className = `p-4 bg-slate-700 hover:bg-slate-600 rounded-lg text-3xl transition-colors piece-${color}`;
                btn.innerHTML = `<i class="fa-solid ${iconMap[p]}"></i>`;
                btn.onclick = () => {
                    pendingMove.promotion = p;
                    makeMove(pendingMove);
                    promotionModal.classList.replace('flex', 'hidden');
                };
                promotionOptions.appendChild(btn);
            });
            
            promotionModal.classList.replace('hidden', 'flex');
        }

        // --- Game Status & Controls ---
        function updateStatus() {
            const statusBadge = document.getElementById('status-badge');
            const signalW = document.getElementById('signal-w');
            const signalB = document.getElementById('signal-b');
            
            let statusHTML = '';
            
            // Update visual signals
            if (game.turn() === 'w') {
                signalW.classList.add('active-w');
                signalB.classList.remove('active-b');
            } else {
                signalB.classList.add('active-b');
                signalW.classList.remove('active-w');
            }

            if (game.in_checkmate()) {
                statusHTML = `<span class="text-red-400 font-bold px-4 py-1 rounded-full bg-slate-800 border border-red-500"><i class="fas fa-trophy mr-1"></i> Checkmate! ${game.turn() === 'w' ? 'Black' : 'White'} wins.</span>`;
                // Dim both signals on game over
                signalW.className = 'turn-signal';
                signalB.className = 'turn-signal';
            } else if (game.in_draw()) {
                statusHTML = `<span class="text-yellow-400 font-bold px-4 py-1 rounded-full bg-slate-800 border border-yellow-500">Game Over - Draw!</span>`;
                 // Dim both signals on game over
                signalW.className = 'turn-signal';
                signalB.className = 'turn-signal';
            } else {
                // Only show text if in check, otherwise keep the badge area clean
                if (game.in_check()) {
                    statusHTML = `<span class="text-red-400 font-bold px-4 py-1 rounded-full bg-slate-800 border border-red-500 animate-pulse"><i class="fas fa-exclamation-triangle mr-1"></i> Check</span>`;
                }
            }

            statusBadge.innerHTML = statusHTML;
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            legalMoves = [];
            updateBoardVisuals();
        }

        function undoMove() {
            game.undo();
            selectedSquare = null;
            legalMoves = [];
            updateBoardVisuals();
        }

        // Start Game
        initBoard();

    </script>
</body>
    </html>
