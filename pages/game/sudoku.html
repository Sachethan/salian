<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            touch-action: manipulation; /* Prevent double-tap zoom on mobile */
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border: 3px solid #1f2937;
            background-color: #1f2937;
            gap: 1px;
        }

        .sudoku-cell {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }

        /* 3x3 Grid Borders */
        .sudoku-cell:nth-child(3n) { border-right: 2px solid #1f2937; }
        .sudoku-cell:nth-child(9n) { border-right: none; }
        .sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #1f2937;
        }

        /* Cell States */
        .cell-fixed { color: #111827; font-weight: 600; }
        .cell-user { color: #2563eb; } /* Blue for user input */
        .cell-selected { background-color: #bfdbfe !important; } /* Blue highlight */
        .cell-highlight { background-color: #e5e7eb; } /* Light gray for row/col/box */
        .cell-same-number { background-color: #dbeafe; }
        .cell-error { background-color: #fecaca !important; color: #dc2626 !important; }
        
        .numpad-btn {
            transition: transform 0.1s, background-color 0.2s;
        }
        .numpad-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 480px) {
            .sudoku-cell { font-size: 1.25rem; }
        }
        
        /* Celebration Animation */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .celebrate { animation: pop 0.5s ease-in-out; }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center py-6 px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 flex flex-col gap-5">
        
        <!-- Header -->
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Sudoku</h1>
                <p class="text-sm text-gray-500" id="timer">00:00</p>
            </div>
            <div class="flex gap-2">
                <button onclick="setDifficulty('easy')" id="btn-easy" class="px-3 py-1 rounded-full text-sm font-medium bg-blue-500 text-white transition-colors">Easy</button>
                <button onclick="setDifficulty('medium')" id="btn-medium" class="px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors">Med</button>
                <button onclick="setDifficulty('hard')" id="btn-hard" class="px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors">Hard</button>
            </div>
        </div>

        <!-- Game Board -->
        <div id="board" class="sudoku-grid shadow-sm rounded-md overflow-hidden">
            <!-- Cells generated by JS -->
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-5 gap-2 mt-2">
            <!-- Numpad 1-9 -->
            <button onclick="inputNumber(1)" class="numpad-btn bg-gray-100 hover:bg-gray-200 text-xl font-medium rounded-lg aspect-square flex items-center justify-center">1</button>
            <button onclick="inputNumber(2)" class="numpad-btn bg-gray-100 hover:bg-gray-200 text-xl font-medium rounded-lg aspect-square flex items-center justify-center">2</button>
            <button onclick="inputNumber(3)" class="numpad-btn bg-gray-100 hover:bg-gray-200 text-xl font-medium rounded-lg aspect-square flex items-center justify-center">3</button>
            <button onclick="inputNumber(4)" class="numpad-btn bg-gray-100 hover:bg-gray-200 text-xl font-medium rounded-lg aspect-square flex items-center justify-center">4</button>
            <button onclick="inputNumber(5)" class="numpad-btn bg-gray-100 hover:bg-gray-200 text-xl font-medium rounded-lg aspect-square flex items-center justify-center">5</button>
            <button onclick="inputNumber(6)" class="numpad-btn bg-gray-100 hover:bg-gray-200 text-xl font-medium rounded-lg aspect-square flex items-center justify-center">6</button>
            <button onclick="inputNumber(7)" class="numpad-btn bg-gray-100 hover:bg-gray-200 text-xl font-medium rounded-lg aspect-square flex items-center justify-center">7</button>
            <button onclick="inputNumber(8)" class="numpad-btn bg-gray-100 hover:bg-gray-200 text-xl font-medium rounded-lg aspect-square flex items-center justify-center">8</button>
            <button onclick="inputNumber(9)" class="numpad-btn bg-gray-100 hover:bg-gray-200 text-xl font-medium rounded-lg aspect-square flex items-center justify-center">9</button>
            
            <!-- Actions -->
            <button onclick="inputNumber(0)" class="numpad-btn bg-red-50 hover:bg-red-100 text-red-500 text-xl font-medium rounded-lg aspect-square flex flex-col items-center justify-center col-start-2">
                <i class="fas fa-eraser text-lg"></i>
            </button>
            <button onclick="startNewGame()" class="numpad-btn bg-blue-50 hover:bg-blue-100 text-blue-600 font-medium rounded-lg col-span-2 flex items-center justify-center gap-2">
                <i class="fas fa-redo"></i> New Game
            </button>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center transform scale-95 transition-transform duration-300">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Puzzle Solved!</h2>
            <p class="text-gray-600 mb-6">Time: <span id="win-time" class="font-bold">00:00</span></p>
            <button onclick="closeModalAndRestart()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-colors">
                Play Again
            </button>
        </div>
    </div>

    <script>
        // --- Sudoku Logic & Generator ---
        class SudokuGenerator {
            constructor(k) {
                this.N = 9;
                this.K = k; // Number of missing digits
                this.SRN = 3; // Square root of N
                this.mat = Array.from({length: 9}, () => Array(9).fill(0));
            }

            fillValues() {
                this.fillDiagonal();
                this.fillRemaining(0, this.SRN);
                this.removeKDigits();
                return this.mat;
            }

            fillDiagonal() {
                for (let i = 0; i < this.N; i = i + this.SRN)
                    this.fillBox(i, i);
            }

            unUsedInBox(rowStart, colStart, num) {
                for (let i = 0; i < this.SRN; i++)
                    for (let j = 0; j < this.SRN; j++)
                        if (this.mat[rowStart + i][colStart + j] === num)
                            return false;
                return true;
            }

            fillBox(rowStart, colStart) {
                let num;
                for (let i = 0; i < this.SRN; i++) {
                    for (let j = 0; j < this.SRN; j++) {
                        do {
                            num = this.randomGenerator(this.N);
                        } while (!this.unUsedInBox(rowStart, colStart, num));
                        this.mat[rowStart + i][colStart + j] = num;
                    }
                }
            }

            randomGenerator(num) {
                return Math.floor(Math.random() * num + 1);
            }

            checkIfSafe(i, j, num) {
                return (this.unUsedInRow(i, num) &&
                        this.unUsedInCol(j, num) &&
                        this.unUsedInBox(i - i % this.SRN, j - j % this.SRN, num));
            }

            unUsedInRow(i, num) {
                for (let j = 0; j < this.N; j++)
                    if (this.mat[i][j] === num) return false;
                return true;
            }

            unUsedInCol(j, num) {
                for (let i = 0; i < this.N; i++)
                    if (this.mat[i][j] === num) return false;
                return true;
            }

            fillRemaining(i, j) {
                if (j >= this.N && i < this.N - 1) {
                    i = i + 1;
                    j = 0;
                }
                if (i >= this.N && j >= this.N) return true;
                if (i < this.SRN && j < this.SRN) j = this.SRN;
                else if (i < this.N - this.SRN) {
                    if (j === Math.floor(i / this.SRN) * this.SRN)
                        j = j + this.SRN;
                } else {
                    if (j === this.N - this.SRN) {
                        i = i + 1;
                        j = 0;
                        if (i >= this.N) return true;
                    }
                }
                for (let num = 1; num <= this.N; num++) {
                    if (this.checkIfSafe(i, j, num)) {
                        this.mat[i][j] = num;
                        if (this.fillRemaining(i, j + 1)) return true;
                        this.mat[i][j] = 0;
                    }
                }
                return false;
            }

            removeKDigits() {
                let count = this.K;
                while (count !== 0) {
                    let cellId = this.randomGenerator(this.N * this.N) - 1;
                    let i = Math.floor(cellId / this.N);
                    let j = cellId % 9;
                    if (j !== 0) j = j - 1;
                    if (this.mat[i][j] !== 0) {
                        count--;
                        this.mat[i][j] = 0;
                    }
                }
            }
        }

        // --- Game State & UI ---
        const boardEl = document.getElementById('board');
        let grid = [];       // Current state
        let initialGrid = []; // Starting state (to lock cells)
        let selectedCell = null; // {r, c}
        let currentDifficulty = 'easy';
        let timerInterval;
        let secondsElapsed = 0;
        let isGameWon = false;

        const difficulties = {
            easy: 35,   // missing cells
            medium: 45,
            hard: 55
        };

        function initGrid() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'sudoku-cell';
                    cell.id = `cell-${r}-${c}`;
                    cell.onclick = () => selectCell(r, c);
                    boardEl.appendChild(cell);
                }
            }
        }

        function setDifficulty(level) {
            currentDifficulty = level;
            
            // Update UI buttons
            ['easy', 'medium', 'hard'].forEach(diff => {
                const btn = document.getElementById(`btn-${diff}`);
                if (diff === level) {
                    btn.className = "px-3 py-1 rounded-full text-sm font-medium bg-blue-500 text-white transition-colors";
                } else {
                    btn.className = "px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors";
                }
            });

            startNewGame();
        }

        function startNewGame() {
            isGameWon = false;
            selectedCell = null;
            
            // Generate Puzzle
            const generator = new SudokuGenerator(difficulties[currentDifficulty]);
            grid = generator.fillValues();
            
            // Deep copy to initialGrid
            initialGrid = grid.map(row => [...row]);

            resetTimer();
            startTimer();
            renderBoard();
        }

        function renderBoard() {
            const conflicts = findConflicts();

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cellEl = document.getElementById(`cell-${r}-${c}`);
                    const val = grid[r][c];
                    
                    cellEl.textContent = val !== 0 ? val : '';
                    
                    // Base classes
                    let classes = 'sudoku-cell';
                    
                    if (initialGrid[r][c] !== 0) {
                        classes += ' cell-fixed';
                    } else if (val !== 0) {
                        classes += ' cell-user';
                    }

                    // Highlighting logic
                    if (selectedCell) {
                        if (selectedCell.r === r && selectedCell.c === c) {
                            classes += ' cell-selected';
                        } else if (selectedCell.r === r || selectedCell.c === c || 
                                  (Math.floor(selectedCell.r/3) === Math.floor(r/3) && Math.floor(selectedCell.c/3) === Math.floor(c/3))) {
                            classes += ' cell-highlight';
                        } else if (val !== 0 && val === grid[selectedCell.r][selectedCell.c]) {
                            classes += ' cell-same-number';
                        }
                    }

                    // Error logic
                    if (conflicts.some(conflict => conflict.r === r && conflict.c === c)) {
                        classes += ' cell-error';
                    }

                    cellEl.className = classes;
                }
            }

            if (!isGameWon && checkWinCondition(conflicts)) {
                handleWin();
            }
        }

        function selectCell(r, c) {
            if (isGameWon) return;
            selectedCell = { r, c };
            renderBoard();
        }

        function inputNumber(num) {
            if (!selectedCell || isGameWon) return;
            const { r, c } = selectedCell;
            
            // Cannot edit fixed cells
            if (initialGrid[r][c] !== 0) return;

            grid[r][c] = num;
            renderBoard();
        }

        function findConflicts() {
            const conflicts = [];
            
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const val = grid[r][c];
                    if (val === 0) continue;

                    let isConflict = false;

                    // Check row
                    for (let i = 0; i < 9; i++) {
                        if (i !== c && grid[r][i] === val) isConflict = true;
                    }
                    // Check col
                    for (let i = 0; i < 9; i++) {
                        if (i !== r && grid[i][c] === val) isConflict = true;
                    }
                    // Check box
                    const boxR = Math.floor(r / 3) * 3;
                    const boxC = Math.floor(c / 3) * 3;
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 3; j++) {
                            const curR = boxR + i;
                            const curC = boxC + j;
                            if ((curR !== r || curC !== c) && grid[curR][curC] === val) {
                                isConflict = true;
                            }
                        }
                    }

                    if (isConflict) conflicts.push({r, c});
                }
            }
            return conflicts;
        }

        function checkWinCondition(conflicts) {
            if (conflicts.length > 0) return false;
            
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (grid[r][c] === 0) return false;
                }
            }
            return true;
        }

        function handleWin() {
            isGameWon = true;
            clearInterval(timerInterval);
            
            // Animate board
            document.getElementById('board').classList.add('celebrate');
            setTimeout(() => document.getElementById('board').classList.remove('celebrate'), 500);

            // Show Modal
            const modal = document.getElementById('win-modal');
            const winTime = document.getElementById('win-time');
            winTime.textContent = formatTime(secondsElapsed);
            
            setTimeout(() => {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                modal.children[0].classList.replace('scale-95', 'scale-100');
            }, 500);
        }

        function closeModalAndRestart() {
            const modal = document.getElementById('win-modal');
            modal.children[0].classList.replace('scale-100', 'scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
                startNewGame();
            }, 200);
        }

        // --- Timer ---
        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed++;
                document.getElementById('timer').textContent = formatTime(secondsElapsed);
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById('timer').textContent = "00:00";
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // --- Keyboard Support ---
        document.addEventListener('keydown', (e) => {
            if (isGameWon) return;

            if (e.key >= '1' && e.key <= '9') {
                inputNumber(parseInt(e.key));
            } else if (e.key === '0' || e.key === 'Backspace' || e.key === 'Delete') {
                inputNumber(0);
            } else if (selectedCell) {
                let { r, c } = selectedCell;
                if (e.key === 'ArrowUp') r = Math.max(0, r - 1);
                if (e.key === 'ArrowDown') r = Math.min(8, r + 1);
                if (e.key === 'ArrowLeft') c = Math.max(0, c - 1);
                if (e.key === 'ArrowRight') c = Math.min(8, c + 1);
                
                if (r !== selectedCell.r || c !== selectedCell.c) {
                    selectCell(r, c);
                    e.preventDefault();
                }
            }
        });

        // Initialize
        initGrid();
        startNewGame();

    </script>
</body>
</html>
