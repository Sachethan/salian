<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iframe Page - login.html</title>
  <script>
    // Function to be called by parent
    function iframeShowMsg(msg) {
      alert('Iframe iframeShowMsg called with: ' + msg);
    }
    // Calling parent function from iframe
    function callParentShowmsg() {
      if (window.parent && window.parent.showmsg) {
        window.parent.showmsg("Hello from Iframe!");
      }
    }
  </script>
</head>
<body>
  <h2>This is the Iframe (login.html)</h2>
  <button onclick="callParentShowmsg()">Call showmsg in Parent</button>
</body>
</html>
