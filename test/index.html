<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parent Page - index.html</title>
  <script>
    // Function to be called by iframe
    function showmsg(msg) {
      alert('Parent showmsg called with: ' + msg);
    }

    // Call function in the iframe
    function triggerIframeFunc() {
      const iframe = document.getElementById('loginFrame');
      if (iframe.contentWindow && iframe.contentWindow.iframeShowMsg) {
        iframe.contentWindow.iframeShowMsg('Hello from Parent!');
      }
    }
  </script>
</head>
<body>
  <h1>Parent Page (index.html)</h1>
  <!-- Iframe embeds login.html -->
  <iframe id="loginFrame" src="login.html" width="400" height="200"></iframe>
  <br>
  <button onclick="triggerIframeFunc()">Call iframeShowMsg in Iframe</button>
</body>
</html>
